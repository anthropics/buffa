kind: Fixed
body: |-
    **Avoid duplicate Rust types when generating borrowed and owned views.** If sibling messages such as `Item` and `ItemOwned` would both generate a view type named `ItemOwnedView`, the owned wrapper for `Item` is named `ItemOwnedView_`. The wrapper stays accessible through `HasMessageView::ViewHandle`.
