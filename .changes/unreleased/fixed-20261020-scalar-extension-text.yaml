kind: Fixed
body: |-
    **Text format writes and reads scalar, enum, string and bytes extensions** (#790). Codegen emitted a text registry entry only for message and group extensions, so `encode_text` silently left out every other extension and `[pkg.ext]: 5` failed to parse as an unknown field, while JSON and binary kept them. Custom options such as `optional string my_option = 50000` on `FieldOptions` were the common case. Each such extension now gets an entry, singular and repeated: a repeated one prints one `[pkg.ext]: value` entry per element, as C++ and Go print it, and parses a list or one value per entry. A closed enum value with no variant, which the parsers reject, is left out of the text.
    The fix is in generated code: regenerate any crate that declares such an extension with `generate_text` enabled. Regenerated code needs this release of `buffa`, because it names new items in `type_registry`: the `scalar_encode_text`, `scalar_merge_text`, `repeated_scalar_encode_text` and `repeated_scalar_merge_text` functions, the `TextScalarCodec` trait they are generic over, and `EnumText`, its implementation for enums. Text output of a message that carries such an extension changes, so golden files need updating.
time: 2026-10-20T12:00:00-07:00
