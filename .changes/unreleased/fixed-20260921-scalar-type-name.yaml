kind: Fixed
body: |-
    **`DescriptorPool` rejects a scalar field that carries a `type_name`** (#460). Linking fails with the new `PoolError::UnexpectedTypeName` instead of silently ignoring the name; this applies to message fields, extensions, and map values alike. `protoc` never emits this shape, so only hand-built or synthesized descriptor sets can hit it. An empty `type_name` is not affected. A field with no `type` is outside this check: it takes its kind from the name (#514).
