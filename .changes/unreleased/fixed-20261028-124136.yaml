kind: Fixed
body: '**`generate_text(true)` compiles with a custom map, `repeated` collection or oneof pointer** (#802). The generated text impl iterated a map or `repeated` field with `for .. in &self.field`, inserted map entries with an inherent `insert`, handed a `repeated` field to the decoder as a `Vec`, and wrapped a message member of a oneof in `Box::new` whatever pointer `box_type_custom` chose, so a crate that combined text with `map_type_custom`, `repeated_type_custom` or a custom oneof pointer did not compile. The text impl now goes through `MapStorage`, `ProtoList` and `ProtoBox` for those fields, as the binary codec does, and a custom container needs nothing more for text. Output for the default `HashMap`, `Vec` and `Box` is unchanged.'
