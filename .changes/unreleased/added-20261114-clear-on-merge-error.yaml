kind: Added
body: '`DecodeOptions::clear_on_merge_error` clears the destination message when `DecodeOptions::merge`, `DecodeOptions::merge_from_slice` or `buffa_descriptor::reflect::DynamicMessage::merge_with_options` fails, including when the input exceeds the size limit, so a failed merge does not leave old or partially merged fields behind. `DecodeOptions::with_clear_on_merge_error(bool)` enables or disables the policy, and `DecodeOptions::clears_on_merge_error` reports its state. Clearing delegates to the message implementation; it does not promise memory wiping or rewind consumed input. `DynamicMessage::merge` always uses the default options, so it never clears. Without the option, merge behavior is unchanged.'
time: 2026-11-14T12:00:00Z
