kind: Security
body: |-
    **Untrusted JSON could pass the recursion limit and abort the process in a build with `serde_json`'s `raw_value` feature** (#NNN). Builds without that feature were not affected. `buffa` does not enable it, but any crate in a build can: run `cargo tree -e features -i serde_json` and look for `raw_value`. With the feature on, `serde_json::Value` reads an object whose first key is `$serde_json::private::RawValue` as the JSON text in the string under that key, and parses that text with a new recursion limit. `buffa` decoded some JSON through `serde_json::Value`, so a sender could nest such strings to any depth, and could supply a value that differs from the one a filter, a log or a signature check sees in the request: a 2.1 MB request overflowed a 384 KiB thread stack and aborted the process. The affected shapes were repeated, map-valued and explicit-presence enum fields, the value of any `"[...]"` key on a message that declares an extension range, and `google.protobuf.Any`, in generated messages and in `DynamicMessage`. They now buffer through a type that reads every object key as data, so the `serde_json` recursion limit bounds the depth of a decode again.
    Updating `buffa`, `buffa-types` and `buffa-descriptor` fixes every shape except the `"[...]"` key, whose fix is in generated code and which affects only messages that declare `extensions N to M;` and are generated with JSON and unknown-field preservation on. `buffa-build` users get it on the next build; `protoc-gen-buffa` and `buf generate` users must reinstall the plugin and regenerate. Code generated by this release needs the `buffa` runtime of this release or later.
    In a build with `serde_json`'s `arbitrary_precision` feature, which `buffa`'s JSON decoding does not support (a field rejects any number that has a fraction or an exponent, or that is outside the `i64` and `u64` ranges), such a number is now also rejected inside a `google.protobuf.Any` payload and in an extension value, and is read as a struct where the payload is a `google.protobuf.Value`. Support for the feature is tracked in #482.
time: 2026-09-23T21:00:20+00:00
