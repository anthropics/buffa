kind: Fixed
body: |-
    **`DescriptorPool` rejects a proto3 extension of a message that is not an options message, and a proto3 field or extension that names a closed enum** (#695). The pool linked both kinds of file without an error. protoc allows an `extend` block in a proto3 file only for the nine options messages of `descriptor.proto`, in package `google.protobuf` or `proto2`. An extension of any other message is the new `PoolError::Proto3ExtensionTargetNotOptions`, which names the extension and its extendee.
    protoc also rejects every field and extension of a proto3 file whose enum is closed, as every enum of a proto2 file is. The pool reports one as the new `PoolError::Proto3ClosedEnumField`, which names the field and the enum; for a map it names the `value` field of the entry message.
    Only hand-built or synthesized descriptor sets can reach either rule, because protoc rejects the file. A test fixture that declares an extension in a proto3 file must extend one of the nine options messages, or declare the extension in a proto2 or editions file. Proto2 and editions files link as before.
