kind: Fixed
body: |-
    Vtable reflection now emits `ReflectElement` for an enum that declares `features.enum_type = CLOSED` in an editions file whose default is open. Previously the impl was gated on the file's default, so a `repeated` or `map` field of such an enum failed to compile with vtable reflection enabled.
