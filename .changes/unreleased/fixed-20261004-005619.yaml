kind: Fixed
body: |-
    **`DescriptorPool` rejects a oneof that has no fields** (#538). A `oneof_decl` entry that no field's `oneof_index` names linked as a oneof without members, which protoc and protobuf-go refuse. It is now `PoolError::EmptyOneof`, in every syntax and for nested messages.
