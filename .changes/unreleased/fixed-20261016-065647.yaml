kind: Fixed
body: '**The vtable-mode `ReflectMessage::has` of a generated owned message reports a `required` scalar, string, bytes or enum field as set when it holds its type''s default value** (#721, closes #627). The owned message stores such a field as a bare value and always encodes it, but its generated `has` applied the implicit-presence test, so `x = 0.0`, `n = 0` or `s = ""` reported the field unset, and the generated `for_each_set` skipped a field the encoder writes. `has` now returns `true` for these fields, proto2 `required` and editions `LEGACY_REQUIRED` alike, as the `DynamicMessage` from `to_dynamic()` and `ReflectMode::Bridge` already did. A `required` message field still reports `MessageField::is_set`, and the view still reports wire presence; the `ReflectMessage::has` docs now say so.'
time: 2026-10-16T06:56:47.2760267+02:00
