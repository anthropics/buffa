kind: Fixed
body: |-
    **A singular string extension whose newest record is not valid UTF-8 reads as absent** (#576). `ExtensionSet::extension` returned the value of an older valid record at the same field number. It now returns `None`, as its documentation says for malformed data, and `extension_or_default` returns the declared default. Serializing such a message to JSON fails with `no value present` where it printed the older value. Records with another wire type are skipped as before.
