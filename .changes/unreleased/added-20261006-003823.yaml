kind: Added
body: |-
    **`FieldMask::union` and `FieldMask::intersection`** (#571). Each returns a normalized mask. A parent path covers its children, so the union of `a` and `a.b` is `a` and their intersection is `a.b`. Both work without `std` and leave their inputs unchanged; the result carries the paths only, without the inputs' unknown fields.
