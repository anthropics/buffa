kind: Breaking changes
body: |-
    **`OwnedView<V>` now requires `V: ViewLifetimeParametric`, a new `unsafe` marker trait** (#381, closes #376). To upgrade: (1) regenerate all code with buffa 0.10 codegen — every generated view gets the impl, and code generated by 0.9 or earlier no longer compiles against 0.10 (`error[E0277]: FooView<'static> does not implement ViewLifetimeParametric`); (2) generic code that calls `HasMessageView::decode_view_handle` adds `M::View<'static>: buffa::ViewLifetimeParametric` at the use site (it implies `ViewReborrow`; the bound cannot live on `HasMessageView` itself); (3) a hand-written view used through `OwnedView` directly must implement `Debug` and `ViewReborrow`, then, after auditing it against the trait's `# Safety` section, add `buffa::unsafe_impl_view_lifetime_parametric!(MyView);` (or the literal `unsafe impl buffa::ViewLifetimeParametric for MyView<'static> {}`). `ViewReborrow::Reborrowed` gains a `Debug` bound; `OwnedView`'s `Debug` is now bounded on `V: ViewReborrow`, its `PartialEq`/`Eq`/`Serialize` on `V: ViewReborrow` plus `for<'b> V::Reborrowed<'b>: Trait`, its `Clone` additionally on the marker, and `to_owned_message`/`reborrow` on `V: ViewReborrow`; all but `Clone` now call the view's impls at the real buffer lifetime rather than on the `'static`-typed value. Generic code that itself carries the `for<'b> V::Reborrowed<'b>: Serialize` (or `PartialEq`) bound may need the view type spelled with a turbofish at the call site on older toolchains, the 1.75 MSRV among them; current rustc infers it.
