kind: Changed
body: |-
    **`encode_to_bytes` / `try_encode_to_bytes` encode into a `Vec<u8>` and convert with `Bytes::from` instead of writing through a `BytesMut`** (#NNN), on `Message`, `ViewEncode`, and generated lazy views; `Rope`'s tail writes go through `BytesMut::extend_from_slice` for the same reason. `bytes` does not inline `<BytesMut as BufMut>::put_slice`, so every tag and varint byte written through a `BytesMut` was an out-of-line call: `encode_to_bytes` was 3–4× slower than `encode_to_vec` on every benchmark shape, with or without LTO, and is now within noise of it. Output bytes and the returned `Bytes` representation are unchanged (`BytesMut::freeze` on a vec-backed buffer already went through `Bytes::from(Vec<u8>)`). Callers that `encode` directly into their own `BytesMut` still pay the slow sink; encoding to a `Vec` and appending it with one `put_slice` is faster even counting the copy — see `benchmarks/buffa/benches/encode_sink.rs`.
time: 2026-09-10T17:40:00.000000000+00:00
