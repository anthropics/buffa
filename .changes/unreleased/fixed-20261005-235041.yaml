kind: Fixed
body: |-
    **`DescriptorPool` rejects a `default_value` where the syntax has no explicit defaults** (#568). A proto3 field or extension with `default_value` set linked, and so did an editions field with `features.field_presence = IMPLICIT`; protoc refuses both. The proto3 case is now `PoolError::ExplicitDefaultInProto3` and the editions case `PoolError::ImplicitPresenceFieldWithDefault`. The proto3 rule also covers `optional` fields and oneof members, as protoc's does; protobuf-go accepts a default on those two.
