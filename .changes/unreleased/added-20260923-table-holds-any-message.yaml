kind: Added
body: '**A table message can hold any message** (#NNN, refs #463). Under `CodecStrategy::Table`, a message no longer falls back to the unrolled codec because a message it holds has no table: a child that is set to `Unrolled`, generated by another crate, or a well-known type such as `Timestamp` is encoded, sized, and decoded through its `Message` impl, at the cost of a function call per child. Encoding such a child into a sink that is not a `BufMut`, such as `Rope`, stages it in a buffer, so the `bytes` fields inside it are copied instead of shared by reference count. `CodeGenWarning::TableCodecFallbackSummary` no longer lists messages that hold a message that is not a table, and setting a message to `Unrolled` no longer keeps the messages that hold it unrolled.'
