kind: Added
body: |-
    **`protoc-gen-buffa` exposes custom field representations** through the repeatable `bytes_type_custom_in=<proto_path>=<rust_type_path>`, `string_type_custom_in=<proto_path>=<rust_type_path>` and `repeated_type_custom_in=<proto_path>=<template>` options. They follow the same proto-path prefix matching and last-match-wins ordering as the corresponding `buffa-build` methods, so `buf generate` workflows can select custom byte, string and `repeated` representations without post-processing generated sources. A custom bytes type used as a `repeated` element or `map` value under `json=true` or `reflection=true` / `reflect_mode=vtable`, and a custom string type used as a `repeated` element or `map` key or value under `reflection=true` / `reflect_mode=vtable`, must be generated for all of its uses in one plugin invocation (`strategy: all` in `buf.gen.yaml`), because the trait impls codegen emits for it are crate-global; per-directory runs that share the type fail to compile with duplicate impls.
