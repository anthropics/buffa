kind: Fixed
body: '**Generated `descriptor_pool()` no longer rejects small schemas built from short type names** (#336, #360). The scaled element-memory bound (`len * 64`) could come out tighter than the untrusted-input default it replaced: descriptor sets whose bulk is one-character type names amplify past 64x (the issue''s shape measures ~71.5x on 64-bit), so a few-kilobyte schema was rejected even though the flat 32 MiB default before 0.9.1 accepted it. The bound is now floored at `DEFAULT_ELEMENT_MEMORY_LIMIT`, so it can only ever be looser than that default, never tighter.'
time: 2026-07-28T10:39:43.538612562-04:00
