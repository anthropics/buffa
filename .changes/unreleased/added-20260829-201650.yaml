kind: Added
body: |-
    **`buffa-build`: `Config::exclude_package` knob** (#293).
    `Config::exclude_package("buf.validate")` (or `.exclude_package(".buf.validate")`) drops all `.proto` files in that package — and any sub-packages — from code generation. Multiple calls accumulate. The same knob is exposed as `exclude_package=<pkg>` in the `protoc-gen-buffa` plugin option string and as `CodeGenConfig::exclude_packages` for direct codegen users. Previously the plugin had this filtering capability but `buffa-build` users had no equivalent.
