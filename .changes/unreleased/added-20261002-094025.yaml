kind: Added
body: '**Field mask coverage and normalization helpers.** `FieldMask::covers` checks exact paths and descendants using dot-separated boundaries. `FieldMask::normalize` sorts paths and removes duplicates and redundant descendants in place, preserving unknown fields. Both helpers work without `std` and do not require message descriptors.'
