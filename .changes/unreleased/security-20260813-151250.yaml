kind: Security
body: |-
    **Reflective JSON serialization (`DynamicMessage::to_json` / `serde_json::to_string(&dyn_msg)`) now bounds nesting across `google.protobuf.Any` payloads.**
    `DynamicMessage`'s `Serialize` impl decodes `Any.value` at serialize time and previously gave each layer a fresh recursion budget, so a sub-megabyte input of deeply nested `Any` messages — which the binary decoder accepts, since `Any.value` is opaque bytes to it — overflowed the stack (an uncatchable process abort). It now threads one `RECURSION_LIMIT` (100) count through nested messages and `Any` payloads alike, and the inner `Any` decode continues that count rather than restarting it, so over-deep input is a `serde` error (text contains `exceeds buffa::RECURSION_LIMIT`). A `DynamicMessage` whose nesting counted through `Any` exceeds 100 levels now fails to serialize; the cap is not configurable in this release. The generated-code `buffa_types::Any` serializer is not covered by this entry.
time: 2026-08-13T15:12:50.838562039+00:00
