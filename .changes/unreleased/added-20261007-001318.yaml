kind: Added
body: |-
    **`Timestamp` and `Duration` convert by reference** (#582, #586). `TryFrom<&Timestamp>` is implemented for `std::time::SystemTime`, `chrono::DateTime<Utc>` and `jiff::Timestamp`, and `TryFrom<&Duration>` for `core::time::Duration`, `chrono::TimeDelta` and `jiff::SignedDuration`, beside the by-value conversions and with the same errors and feature gates. Both types are `Clone` and not `Copy`, so a caller holding a reference had to clone the message to convert it.
