kind: Added
body: |-
    **`Timestamp` converts by reference** (#582). `TryFrom<&Timestamp>` is implemented for `std::time::SystemTime`, `chrono::DateTime<Utc>` and `jiff::Timestamp`, beside the by-value conversions and with the same errors and feature gates. `Timestamp` is `Clone` and not `Copy`, so a caller holding a reference had to clone the message to convert it.
