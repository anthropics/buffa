kind: Breaking changes
body: '**Some nested-types module paths change** (#560). For a message beside a sub-package of the same snake_case name (`message Oof` beside `package foo.oof`), the modules under `__buffa` take the name the owned module already had: `foo::__buffa::oneof::oof::Kind` becomes `foo::__buffa::oneof::oof_::Kind`, and likewise under `__buffa::view`, `__buffa::view::oneof` and `__buffa::lazy_view`. The re-exports in the owned module (`foo::oof_::Kind`, `foo::oof_::InnerView`) keep their paths. The nested types of a message named `Arbitrary`, and of a top-level message named `Oneof`, move from `arbitrary::` and `oneof::` to `arbitrary_::` and `oneof_::`, whatever the configuration; such a message compiled before with the `arbitrary` feature off, or with views off. A crate that reaches these types through `extern_path` regenerates together with the crate that owns them.'
