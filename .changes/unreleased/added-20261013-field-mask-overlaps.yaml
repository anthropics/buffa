kind: Added
body: |-
    **`FieldMask::overlaps(path)` reports whether a mask selects `path` or anything under it** (#710, closes #646). It is true when a mask path equals `path`, is an ancestor of it, or is a descendant of it, so a mask of `settings.theme` overlaps `settings` though it does not cover it. A handler that updates a sub-message as a unit no longer needs to call `covers` once per field or build a second mask for `intersection`. Paths follow the rules `covers` documents. An empty mask overlaps nothing, so a handler that treats an absent update mask as every field must check `is_empty` first.
time: 2026-10-13T06:54:21+08:00
