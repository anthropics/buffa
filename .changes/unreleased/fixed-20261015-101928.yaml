kind: Fixed
body: |-
    **`DescriptorPool` rejects a map entry message used as the type of anything but its map field** (#720, closes #637). A message with `map_entry = true` can be the type of one field only: a repeated message field of the message the entry is nested in, whose name gives the entry's name. The entry of field `foo_bar` must be `FooBarEntry`: drop each `_`, upper-case the first character and each character that followed a `_`, keep the case of the rest, and append `Entry`. Every other field or group whose type is a map entry fails with the new `PoolError::InvalidMapEntryUse`, which carries the entry name a map field of that name requires. Before, the pool did not compare the names, so a second repeated field of an entry's type linked as a second map, and a singular field or a field of another message linked as an ordinary message field.
    protoc rejects these fields. The one that protobuf 33.5 still accepts when it builds a descriptor, a repeated group named for its entry, cannot be written in a `.proto` file. So only hand-built or synthesized descriptor sets are affected. One such shape linked as a working map before: an entry nested in the right message under another name (field `f1`, entry `E1`). Rename the entry, or clear `map_entry` on a message that is not a map's entry. `buffa-codegen` does not check the entry name, so it still generates a map field for such a set, and with `generate_reflection` the generated `descriptor_pool()` then panics on first use (#626 covers the descriptors that codegen accepts and the pool rejects).
    An extension whose type is a map entry fails with the new `PoolError::ExtensionWithMapEntryType`. One shape that protoc compiles is rejected too, so this rule can affect a protoc-built set loaded at runtime: `extend Holder { repeated Holder.EntriesEntry entries = 100; }`, which protoc treats as a map and the pool linked as a list of entry messages before. Give such an extension an ordinary message type with `key = 1` and `value = 2`, which has the same wire form. Generated code never supported the shape: the code `buffa-codegen` emits for it names the entry's struct, which is not generated.
