kind: Fixed
body: '**`DescriptorPool` rejects a field or extension whose type is a map entry message it does not own** (#720, closes #637). A repeated message field linked as a map when its type was a `map_entry` message nested in the same message, whatever the entry''s name, and every other field or extension of such a type linked as an ordinary message field. So a second repeated field of an entry''s type linked as a second map, and a field of another message linked as a list or a singular message. As in protoc, a map entry can now be the type only of a repeated message field of the message that declares the entry, or of a repeated message extension of that message, and the entry''s name must be the field''s name in upper camel case followed by `Entry` (field `foo_bar`, entry `FooBarEntry`). Such an extension links as a list of entries, as before. Every other field or extension of a map entry type fails with the new `PoolError::InvalidMapEntryUse`. protoc rejects every such field, so only hand-built or synthesized descriptor sets are affected.'
