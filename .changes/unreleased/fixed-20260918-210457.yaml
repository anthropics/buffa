kind: Fixed
body: |-
    **Views now compile recursive schemas with `preserve_unknown_fields(false)`** (#449). Eagerly, a singular message field is emitted as `MessageFieldView<V>`, which carries no lifetime of its own, so a message whose fields reach `'a` only through another view left its struct with a recursive-only lifetime parameter and codegen failed to build — for a direct self-reference, for a self-reference behind a `oneof`, for a self-reference through a nested message, and for two messages that reference each other. Those structs now carry the same `#[doc(hidden)]` zero-sized `PhantomData<&'a ()>` anchor the all-scalar lean case already used. Fields that borrow the decode buffer themselves — `&'a str`, `&'a [u8]`, `RepeatedView<'a, T>`, `MapView<'a, K, V>` — and a `oneof` with a `string` or `bytes` variant still anchor the lifetime and emit nothing new, and lazy views are unaffected because `LazyMessageFieldView<'a, V>` borrows the buffer itself.
    Two consequences for consumers of lean views. A view whose fields are all message- or group-typed gains the `__buffa_phantom` member even when the reference is not recursive: separating those cases would mean resolving the message graph, which codegen cannot do for `extern_path` and cross-crate views anyway. The member is zero-sized and absent from serialized output, but it is a public field and views are not `#[non_exhaustive]`, so code that constructs or destructures such a view exhaustively must add `..Default::default()`, and its `{:?}` now ends with `__buffa_phantom: PhantomData`. Views built with unknown-field preservation on — the default — are unchanged, and so is the checked-in well-known-type output.
