kind: Added
body: |-
    **Warn when a custom attribute rule matches no generated element** (closes #697). `generate_with_diagnostics` now emits `CodeGenWarning::AttributeRuleMatchedNothing { rule, option }` for any entry in `type_attributes`, `field_attributes`, `message_attributes`, `enum_attributes`, `oneof_attributes`, or `oneof_struct_field_attributes` that matched no element generated by the run, surfacing typos and wrong-kind paths (such as a variant path passed to `oneof_struct_field_attributes`) at build time.
time: 2026-11-22T18:18:00+09:00
