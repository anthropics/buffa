kind: Breaking changes
body: |-
    **Generated byte-key protobuf maps with non-bytes values require `buffa::json_helpers::ProtoElemJson`, and ProtoJSON parsing of primitive wrapper values follows the generated-field rules** (#368). For `map<string, V>` fields whose key is mapped to `Vec<u8>` (`utf8_validation = NONE` under strict UTF-8 mapping), regenerated code selects `json_helpers::proto_bytes_key_map` for non-bytes values; bytes-valued maps retain `bytes_key_bytes_val_map`. The generic `bytes_key_map` adapter retains its `serde::Serialize` and `serde::Deserialize` bounds and ordinary Serde value representation. Generated messages and enums, built-in scalar types and primitive wrappers implement `ProtoElemJson`. A value type that implements only serde, such as an external message routed through `extern_path`, must implement `ProtoElemJson` for generated protobuf maps; the impl can delegate to the type's serde impls. The other protobuf container helpers (`proto_seq`, `proto_map`, `proto_str_key_map`) already have this requirement.
    Primitive wrappers now use the same scalar parsing rules as generated fields, including direct deserialization of `null` as the default value. Repeated and map wrapper values reject null elements. Maps with such keys now apply the same ProtoJSON encoding to values as other maps do, including quoted `int64` values.
