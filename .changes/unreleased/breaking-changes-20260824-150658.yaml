kind: Breaking changes
body: |-
    **`json_helpers::bytes_key_map` now requires its values to implement `buffa::json_helpers::ProtoElemJson`, and ProtoJSON parsing of primitive wrapper values follows the generated-field rules** (#368). `bytes_key_map` is the serde helper for `map<string, V>` fields whose key is mapped to `Vec<u8>` (`utf8_validation = NONE` under strict UTF-8 mapping); its value bound was `serde::Serialize` and `serde::Deserialize`, and `ProtoElemJson` replaces it. Generated messages and enums, the built-in scalar types and the primitive wrappers implement it, so those need no change. A value type that implements only serde, such as an external message routed through `extern_path`, must implement `ProtoElemJson` to keep compiling; the impl can delegate to the type's serde impls. The other container helpers (`proto_seq`, `proto_map`, `proto_str_key_map`) already had this requirement.
    Primitive wrappers now use the same scalar parsing rules as generated fields, including direct deserialization of `null` as the default value. Repeated and map wrapper values reject null elements. Maps with such keys now apply the same ProtoJSON encoding to values as other maps do, including quoted `int64` values.
time: 2026-08-24T15:06:58.667785+02:00
