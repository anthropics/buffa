kind: Added
body: |-
    **`(buffa.ext.field).name` sets the Rust name of a field** (#544). A schema that imports `buffa/ext/options.proto` can write `string type = 1 [(buffa.ext.field).name = "kind"];`, and the generated struct field is `kind`, where the proto name gives `r#type`. The view's field and the `with_*` setter follow the option. On a field in a oneof, the value is the variant's name. buffa uses the value as written and does not change its case. The wire format, the JSON and text format names, and the descriptor keep the proto name. The value must be an ASCII Rust identifier that is not a keyword and does not start with `__buffa_`; any other value, and the option on an extension, fails with the new `CodeGenError::InvalidNameOption`, whose `problem` is a `NameOptionProblem`. A value that another field or oneof of the same struct already has as its Rust name, or another variant of the same oneof, fails with the new `CodeGenError::NameOptionConflict`. `buffa-codegen` now depends on `buffa-proto-options`.
