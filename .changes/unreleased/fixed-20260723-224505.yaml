kind: Fixed
body: |-
    **`MapView::iter_unique` / `len_unique` are `O(n log n)` instead of `O(n^2)`** (#340). The pairwise scan short-circuited only when it *found* a duplicate, so a map with all-distinct keys — ordinary well-formed input — was the worst case rather than the benign one: 802 KB of wire data cost 5.3 s of CPU to serialize a decoded view as JSON against 0.9 ms to decode it, now 9.5 ms. This is reachable from any service that serializes a decoded view (or walks it through vtable reflection) on wire data a peer controls. Deduplication sorts rather than hashes, so attacker-controlled keys cannot be made to collide; the generated view `Serialize` now passes the exact survivor count as the map size hint, and `ReflectMap::is_empty` on a `MapView` no longer pays for the deduplication.
