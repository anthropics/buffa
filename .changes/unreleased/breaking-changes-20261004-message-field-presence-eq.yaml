kind: Breaking changes
body: |-
    **`MessageField` and `MessageFieldView` equality includes presence** (#559, refs #558). An unset field no longer equals one set to its default value, matching Go's `proto.Equal`, C++'s `MessageDifferencer::Equals`, prost's `Option<T>`, and buffa's own `optional` scalars, oneofs and `DynamicMessage`. The two encode differently (a set field is on the wire even when empty), so the old `==` could call two messages equal whose bytes and `is_set()` differ, for example a `google.protobuf.Int32Value` field set to `0` and one left null.
    This is a silent change: code compiles unchanged and only the result of comparisons differs. The usual break is a test comparing a decoded message with one built from `..Default::default()` when the input carried an empty sub-message (`address {}` in text format, `"address": {}` in JSON, or a sender that set the field without filling it); `assert_eq!` then shows `MessageField::Unset` on one side and `MessageField::Set(..)` on the other. Set the field in the expected value (`address: Address::default().into()`) or compare the fields you care about. Likewise, a field reached through `get_or_insert_default()` or `modify()` is set even if its contents stay default, so the message no longer equals its untouched clone. Outside tests the same difference reaches an emptiness check (`msg == Msg::default()`), change detection (`if old != new`), and `contains` or `dedup` over messages; ask `is_set()` where the question is presence. To compare one field's value with unset treated as the default, deref it: `*a.address == *b.address`. This ignores presence at that level only: message fields nested inside still compare it, and there is no presence-blind comparison of whole messages. Generated views do not implement `PartialEq`, so the `MessageFieldView` change affects only hand-written views. The `T: DefaultInstance` bound on `MessageField`'s `PartialEq`/`Eq` and the `DefaultViewInstance` bound on `MessageFieldView`'s are dropped. The change is in the runtime, so it needs no regeneration and also applies to the message types in `buffa-types` and `buffa-descriptor`.
