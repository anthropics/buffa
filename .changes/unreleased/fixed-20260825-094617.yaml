kind: Fixed
body: |-
    **Generated textproto parsers now reject unknown field names by default**, matching upstream protobuf text-format parsers and surfacing spelling mistakes instead of silently discarding values. Previously accepted unknown names now return `ParseErrorKind::UnknownField`. Declared reserved field names remain accepted and their values are discarded with `TextDecoder::skip_value()`. Hand-written `TextFormat` implementations can also opt into lenient parsing with the public `skip_value()` method.
time: 2026-08-25T09:46:17+02:00
