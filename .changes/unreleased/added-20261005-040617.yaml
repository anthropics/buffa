kind: Added
body: |-
    **Codegen emits `#[deprecated]` for `[deprecated = true]`** (#564). A field or enum value with the option was generated without the attribute, so a migration from prost lost every deprecation warning. The attribute now goes on the field and its `with_*` setter, on the same field of the generated views (`FooView`, `FooLazyView`) and its `FooOwnedView` accessor, on the enum variant, and on each `allow_alias` value and idiomatic `CamelCase` const that names a deprecated value. The generated impls that visit every field carry `#[allow(deprecated)]`, so the generated code itself does not warn. Under `generate_arbitrary`, an enum with a deprecated variant gets a generated `Arbitrary` impl in place of the derive, which would warn; the impl maps input to variants as the derive does. A field that already has `#[deprecated(...)]` from `field_attribute` keeps that attribute and its note; such an attribute reaches the owned struct only, so the views follow the option. Encoding is unchanged: a deprecated value still round-trips in binary, JSON and text, and stays in `Enumeration::values()`. Oneof variants are not marked yet, and whole messages and enums are not marked, as in prost.
