kind: Fixed
body: '**A message or enum named after a Rust keyword, or after a primitive type that generated code uses, now generates** (#556). The Rust type gets a trailing underscore: `message type` generates `pub struct type_`, `message Self` generates `pub struct Self_`, and `message bool` generates `pub struct bool_`; the same suffix applies to `str`, `u8`, `usize`, `i32`, `i64`, `u32`, `u64`, `f32` and `f64`. Two types in one package or one message that end up with one Rust name are rejected with `CodeGenError::TypeNameConflict`. The proto name is unchanged in JSON, the text format, type URLs and reflection.'
time: 2026-10-04T10:56:44.719383439-07:00
