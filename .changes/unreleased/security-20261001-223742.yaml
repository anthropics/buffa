kind: Security
body: |-
    **The reflective JSON parser charges a `google.protobuf.Any` payload's buffer to the element memory limit, so `DynamicMessage::from_json` and `DynamicMessageSeed` may reject input that parsed in earlier releases** (#507, fixes #493). An `Any` is read in full before its `@type` is known, so its object is buffered as a `serde_json::Value` tree, and until now only the input length bounded that tree. While the buffer is held, each object member of the payload now costs what a map entry costs and each array element what a repeated element costs (88 and 64 bytes on a 64-bit target with a current compiler), at every depth. The members include `@type`, singular fields and unknown fields. A parse that exceeds the limit fails with the element-memory error before the rest of the payload is buffered.
    The parser returns the buffer's charge after it decodes the payload, and it charges the elements that the decode builds while it still holds the buffer. So a payload needs room for its buffer and its message together, on top of what the parse has kept when it reaches the `Any`: an `Any` that follows a large repeated field has less room than one that precedes it. Each enclosing `Any` buffers a nested `Any` again, so a value at `Any` depth d is charged in d buffers while the innermost payload is decoded. With the default 32 MiB and those sizes, a payload of singular fields can buffer 381,300 members, and a payload that is one repeated field of scalars can have about 262,000 elements. To accept more, raise the limit with `DynamicMessageSeed::with_element_memory_limit`. Generated-message JSON still has no element limit (#330).
