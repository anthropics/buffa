kind: Fixed
body: |-
    **A declared default value is now parsed and validated when the pool links, and the typed value is exposed on `FieldDescriptor`** (#638). `DescriptorPool` only ever asked whether `default_value` was set, so a hand-built descriptor whose `int32` field declared the default "seven" linked without complaint, where protoc reports "Couldn't parse default value" and protobuf-go fails with "has invalid default". The string is now parsed against the field's resolved type at link time (integer range, float literals including `inf` and `nan`, `true` and `false`, an enum value name the enum declares, C-escaped bytes), and one that does not parse is rejected with the new `PoolError::InvalidDefaultValue`. The parsed value is available from the new `FieldDescriptor::default_value`, typed as the new `buffa_descriptor::DefaultValue`, and `reflect::Value` converts from it with `From`. What `ReflectMessage::get` returns for an unset field is unchanged; that remains a separate decision.
