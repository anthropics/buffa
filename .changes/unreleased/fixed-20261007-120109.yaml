kind: Fixed
body: |-
    **`DescriptorPool` rejects a map whose enum value type does not declare zero as its first value** (#601). A `map<K, E>` field linked when the first value of `E` was nonzero, which a closed enum allows for an ordinary field. protoc reports "Enum value in map must define 0 as the first value." in every syntax. The enum is checked wherever it is declared: after the map, in another file of the set, or in a file already in the pool. Only hand-built or synthesized descriptor sets can reach this, because protoc rejects the file. The rejection is the new `PoolError::MapEnumFirstValueNotZero` variant, which names the map field, the enum and its first number.
