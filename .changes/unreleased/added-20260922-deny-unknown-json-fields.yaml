kind: Added
body: |-
    **Strict JSON unknown-field rejection** (closes #444). `buffa_build::Config::deny_unknown_json_fields` makes generated JSON deserializers reject unknown keys instead of ignoring them, with the path-scoped `deny_unknown_json_fields_in` for selected messages (plugin options `deny_unknown_json_fields=true` / `deny_unknown_json_fields_in=<path>`, repeatable; `CodeGenConfig::deny_unknown_json_fields_in` is a `Vec<(String, bool)>` of `(path, enabled)` rules). **The default is unchanged — unknown keys are still ignored — so this is opt-in.**

    Why: proto3's JSON mapping specifies rejection, and buffa's generated textproto parsers and its reflective `DynamicMessage::from_json` decoder already reject. The generated JSON decoders were the exception, so a misspelled key parsed into a default message and `.validate()` then ran against a well-formed default — silent in both directions.

    One switch covers both codegen paths, and both report through serde's own `unknown_field`, so the diagnostic does not depend on a message's shape: messages generated with `#[derive(Deserialize)]` get serde's `#[serde(deny_unknown_fields)]`, and messages whose `Deserialize` is hand-written — those with a oneof, or with extension ranges under preservation — get a strict terminal match arm. Both spellings of every field stay accepted. `"[pkg.ext]"` keys are claimed by the extension arm first, so extension handling and `JsonParseOptions::strict_extension_keys` are unaffected — except for a message with extension ranges but preservation off, which has no extension arm and so rejects them like any other unknown key. Paths use the same proto-segment prefix matching as `preserve_unknown_fields_in` and the last matching rule wins; a rule matching no generated message produces a new `CodeGenWarning::DenyUnknownJsonFieldsRuleMatchedNothing`, and setting the option without `generate_json` produces `CodeGenWarning::DenyUnknownJsonFieldsRequiresJson`.
