kind: Security
body: |-
  Omit wrong-kind values from ProtoJSON decoding diagnostics at bool and string fields, including optional, repeated, map and oneof positions; scalar, bytes and container helpers; generated messages with a oneof or extension range; scalar and structural well-known types; and corresponding reflective JSON positions. Wide integer callbacks use checked narrowing and fixed rejection reasons. Default string representations use the redacting helpers. Custom string representations retain their native Serde conversions and validation in optional, repeated, map and oneof positions. Custom collection representations also retain the bool/default-string Serde paths they used before this hardening. JSON null remains unset/default where the protobuf mapping requires it, and null elements or map values remain rejected. Regenerate existing bindings with the matching generator to update generated routing.
  Non-human-readable formats retain the typed map, sequence and string entry points they previously supported. New optional bool/default-string helpers retain native Option encoding there; this does not add a general binary-Serde compatibility guarantee to ProtoJSON types. With buffa-yaml, default string and temporal-string positions now follow JSON kinds: numeric and boolean YAML scalars are rejected instead of coerced into text in the newly routed positions. An empty repeated-string item is null and rejected. Custom string Serde policies are unchanged. Empty or comment-only YAML input still decodes as default message, Struct, ListValue or Empty values in typed and reflective codecs, and tags remain transparent at structural and temporal-string positions that previously ignored them. Bool/default-string scalar helpers reject tagged values, including tagged null, so a tag cannot bypass field presence or container null rejection. An explicitly empty YAML document (`---`) is now rejected at those structural positions: Serde reports it as the same unit kind as JSON null, which must remain invalid there.
  Messages and Empty reject an unrecognized object member named $serde_json::private::Number, the spelling used by serde_json's unsupported arbitrary_precision feature to present some numbers as objects. An explicit schema json_name with that spelling remains valid. Such a message retains typed object checking so a synthetic number cannot be accepted as a field; its early wrong-kind errors remain Serde/parser diagnostics and can include input. Other remaining scope limits are derived messages without a oneof or extension range given a non-object, containers of those message types, Any given a non-object, parser errors and custom representation diagnostics. Struct and ordinary map keys continue to treat Serde's private token spellings as data.
time: 2026-11-17T12:00:00Z
