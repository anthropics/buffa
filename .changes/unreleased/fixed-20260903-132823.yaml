kind: Fixed
body: |-
    **`DescriptorPool` validates reserved-range bounds as `protoc` does** (#418), instead of silently dropping a malformed range and reserving nothing. An unset bound reads as 0; a message reserved range must then satisfy `0 < start < end` (so a missing, zero, negative, empty, or reversed range is `PoolError::InvalidMessageReservedRange`), and an enum reserved range, which is inclusive and may be negative, must satisfy `start <= end` (`PoolError::InvalidEnumReservedRange`). Only hand-built or synthesized descriptor sets can reach either.
