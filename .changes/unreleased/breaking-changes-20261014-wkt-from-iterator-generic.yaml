kind: Breaking changes
body: |-
    **`FromIterator` for `Struct` and `ListValue` accepts the item types `Extend` does** (#715). `Struct` collects from `(K, V)` pairs with `K: Into<String>` and `V: Into<Value>`, and `ListValue` from items that are `Into<Value>`, so `[("a", 1.0)].into_iter().collect::<Struct>()` and `[1.0, 2.5].into_iter().collect::<ListValue>()` compile; before, the items had to be `(String, Value)` and `Value`. `FromIterator` for `FieldMask`, added in this release (#608), has the same shape. Code that collects `Value` or `(String, Value)` items compiles unchanged. Code that left the item type for `collect` to infer no longer compiles; the error is "type annotations needed" (E0282 or E0283), or E0790 for an item written as `Default::default()`. The patterns are `.map(Into::into).collect::<ListValue>()`, `.map(|(k, v)| (k.to_string(), v.into())).collect::<Struct>()`, an item built by `Default::default()` or `serde_json::from_str`, and an empty `[]` or `iter::empty()` source. Name the type at the conversion, as in `.map(Value::from)`, `(k.to_string(), Value::from(v))` or `iter::empty::<Value>()`, or delete the `map` where the items already convert. The same holds for `Struct::from_iter`, `ListValue::from_iter`, and collecting into an `Option` or `Result` of either type.
time: 2026-10-14T19:40:00.000000000+00:00
