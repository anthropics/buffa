kind: Added
body: |-
    **Borrowed packed varint fields in views** (closes #814). With `buffa_build::Config::packed_views_in(paths)`, or `packed_views()` for every field (plugin options `packed_views_in=<path>` and `packed_views=true`; `CodeGenConfig::packed_view_fields`), views hold the selected packed `int32`, `int64`, `uint32`, `uint64`, `sint32`, `sint64` and `bool` fields as `buffa::PackedView`s instead of `RepeatedView`s, so decoding a view makes no allocation for them: decoding checks the packed payload and borrows it, and `iter()` decodes the elements. A field that arrives in more than one record holds decoded elements instead. It applies to eager and lazy views, but not to views that implement reflection (`generate_reflection_vtable`). A `PackedView` has no slice: code that indexes or derefs such a field uses `iter()` or `to_vec()`, and each iteration decodes the elements again, so fields read by index or more than once are best left out of the paths. A path covers a package, a message with its nested messages, or a field; in `CodeGenConfig::packed_view_fields` the last matching `(path, enabled)` rule wins. A path that matches no field, and rules that cannot apply (views off, or views with reflection), produce warnings. Off by default; generated code is unchanged without it.
