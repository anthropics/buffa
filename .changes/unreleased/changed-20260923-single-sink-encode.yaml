kind: Changed
body: |-
    **The encode entry points write every `BufMut` through one pre-sized cursor** (#467).
    `encode`, `encode_to_vec` and their `try_`, `_with_cache`, bounded and length-delimited variants on `Message` and `ViewEncode` compute the exact size first, then write a `Vec<u8>`, `BytesMut`, slice or other `BufMut` into that many contiguous bytes of its spare capacity, using stores that are bounds-checked but never grow the sink. Each message's `write_to` is compiled once for all `BufMut` sinks instead of once per sink type, and `encode` into a `BytesMut` with room no longer makes a call per tag and varint byte. A sink with less room than the message (an empty `Vec::new()` offers 64 bytes) is filled through a scratch `Vec` and appended with one `put_slice`, so reserving `encoded_len()` bytes first avoids an extra allocation and copy. `Rope` and any type that implements `EncodeSink` and not `BufMut` still receive every write individually, and generated lazy views and `DynamicMessage` are unchanged.
    Behaviour changes for `BufMut` sinks: a manual `write_to` that produces more bytes than its `compute_size` declared now panics with `write_to produced more bytes than compute_size declared` in release builds as well as debug builds; in debug builds a `write_to` that produces fewer bytes panics too, in every encode entry point and not only in the `*_to_vec` and `*_to_bytes` ones; a `BufMut` wrapper that observes bytes in its own `put_*` overrides no longer sees them individually and can observe them in `advance_mut` instead; and a `Vec::new()` retains at least 64 bytes of capacity after encoding into it. `EncodeSink` gains the `#[doc(hidden)]` items `__PRE_SIZED` and `__write_pre_sized`, and the module gains the `#[doc(hidden)]` type `PreSized`; existing implementations need not change.
