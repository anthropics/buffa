kind: Added
body: |-
    **Table-driven message codec** (#469, refs #463). `buffa_build::Config::codec_strategy(CodecStrategy::Table)` (plugin option `codec_strategy=table`, `CodeGenConfig::codec_strategy`) generates each message's binary `Message` implementation from a static table and interpreters that every message shares, instead of code specialised to the message's fields. On a schema the table fully covers it roughly halves the compiled size at `opt-level = "z"`; on the WhatsApp schema, where 43 of 752 messages have a `oneof` or `map` and stay unrolled, the text section is 40% smaller. Messages made of many small fields are slower. `CodecStrategy::Unrolled` stays the default. `codec_strategy_in(strategy, &[paths])` (plugin option `codec_strategy_in=<path>=<strategy>`, repeatable) chooses the strategy for matching messages and the messages nested in them, and the last matching rule wins. The wire format does not change. A message that has a `oneof`, `map`, or group field stays unrolled, and so does a message that holds a message of the same run with a `bytes` field of a non-default type, because the table would copy the `bytes::Bytes` fields that unrolled code shares with the input; `CodeGenWarning::TableCodecFallbackSummary` counts them. A table message may hold any other message, and reaches one that has no table through its `Message` impl, which stages the child in a buffer when it is written to a `Rope` or another sink that is not the cursor `Message::encode` uses, and so copies it. A rule that selects the table, by exact path, for a message that cannot use it is an error. The generated code needs Rust 1.77 or later, which `buffa-build` checks, and compiles in a crate with `#![forbid(unsafe_code)]`; see the guide's "Smaller generated code" section for the rest.
time: 2026-09-23T03:10:00+00:00
