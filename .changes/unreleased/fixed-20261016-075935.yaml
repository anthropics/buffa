kind: Fixed
body: '**Codegen infers the type of a field or extension that has `type_name` set and `type` unset, instead of generating it as an `f64`** (#722, closes #625). `FieldDescriptorProto.type` need not be set when `type_name` is, and `buffa_build::Config::descriptor_set` and `descriptor_set_bytes` accept a set built by a tool that leaves it out, but codegen read the unset `type` as `TYPE_DOUBLE`: such a message field generated an `f64` with fixed64 encoding, with no error. `generate` now sets `TYPE_MESSAGE` or `TYPE_ENUM` from the message or enum that the fully qualified `type_name` names, as protoc and `DescriptorPool` do, before feature overrides and generation read it, and the shared descriptor set from `encode_descriptor_set` carries the same types. When the name is not fully qualified or matches neither, `generate` returns a `CodeGenError::Other` naming the field. A set in which every field has its `type`, which is all protoc output, generates as before.'
time: 2026-10-16T07:59:35.2786653+02:00
