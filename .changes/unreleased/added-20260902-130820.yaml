kind: Added
body: **`DynamicMessage::try_from_message`: a fallible, name-resolving bridge from a generated message** (#413). Resolves the descriptor from the type's `MessageName` and returns a new `BridgeError` (`MessageNotFound` / `Decode`, re-exported from `buffa_descriptor::reflect` and the crate root) instead of panicking when the pool lacks the type or the encoded bytes fail to decode against its descriptor. `DynamicMessage::try_from_message_with_index` is the fallible form for callers that already hold a `MessageIndex`; `from_message` now shares its decode step. The bridge decodes the process's own bytes with the untrusted-input element-memory and unknown-field budgets lifted, so a large generated message no longer fails the round-trip with `ElementMemoryLimitExceeded`.
