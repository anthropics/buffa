kind: Breaking changes
body: |-
    **`DescriptorPool` enforces import visibility when linking** (#428, closes #423). A `type_name`, `extendee`, or method input/output type must now resolve to a definition in the referring file itself, a file in its `dependency` list, or a file those re-export through `import public`; a reference into any other file fails with the new `PoolError::NotImported`, as it does under `protoc`. Previously every name resolved against the whole pool, so a file could use types it never imported. Descriptor sets from `protoc --include_imports`, `buf build`, and buffa's own embedded `FILE_DESCRIPTOR_SET_BYTES` are unaffected; a hand-built `FileDescriptorProto` that references another file must now list it in `dependency`. A listed dependency that is absent from the pool is still tolerated unless something it defines is referenced. The new `LinkOptions` (via `DescriptorPool::with_link_options`) turns enforcement off (`enforce_import_visibility(false)`) or makes absent imports an error (`require_dependencies_present(true)`, reported as `PoolError::ImportNotFound`).
time: 2026-09-06T16:30:00+00:00
