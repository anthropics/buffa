kind: Breaking changes
body: |-
    **`DescriptorPool` enforces import visibility when linking** (#428, closes #423). A `type_name`, `extendee`, or method input/output type must now resolve to a definition in the referring file itself, a file in its `dependency` list, or a file those re-export through `import public`; a reference into any other file fails with the new `PoolError::TypeNotImported`, as it does under `protoc`. Previously every name resolved against the whole pool, so a file could use types it never imported. Descriptor sets from `protoc --include_imports`, `buf build`, and buffa's own embedded `FILE_DESCRIPTOR_SET_BYTES` are unaffected; a hand-built `FileDescriptorProto` that references another file must now list it in `dependency`, and two files with the same name in one set are now `PoolError::DuplicateFileName`. A listed dependency that is absent from the pool is still tolerated unless something it defines is referenced.
    To keep the old behaviour, build the pool with `DescriptorPool::decode_with_link_options(bytes, &DecodeOptions::new(), LinkOptions::new().with_import_visibility(false))` (or `DescriptorPool::with_link_options` for an empty pool); `LinkOptions::with_required_dependencies(true)` instead makes an absent non-weak import an error (`PoolError::DependencyNotFound`).
time: 2026-09-06T16:30:00+00:00
