kind: Fixed
body: '**`OwnedView::into_bytes` could drop the wrapped view twice if its destructor panicked** (#377). The method ran the view''s destructor while `self` was still a live `OwnedView`, so a panic inside `V::drop` unwound into `OwnedView`''s own `Drop` impl and dropped the view a second time. Generated view types have no `Drop` impl, so only a hand-written `MessageView` whose destructor can panic was exposed. `OwnedView` now has no `Drop` impl at all: it stores the view before the buffer, in a private `MaybeDangling` wrapper modelled on the `yoke` crate, and relies on declaration-order drop glue, so `into_bytes` is a plain field move and a panicking view destructor cannot be re-entered. The wrapper also hides the view''s forged `''static` borrows from the aliasing model, so dropping an `OwnedView` received by value — which Miri reported as undefined behaviour under field retagging — is now well-defined. Reported by HackerOne researcher waynezinn.'
