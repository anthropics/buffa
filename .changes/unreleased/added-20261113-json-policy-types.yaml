kind: Added
body: |-
    **Custom byte and string representations can own their protobuf JSON encoding** through the new `buffa::json_helpers::ProtoBytesJson` and `ProtoStringJson` traits. List a type with `buffa_build::Config::json_policy_type` (plugin option `json_policy_type=<rust_type>`, repeatable), and every JSON use of it goes through the trait: singular, optional, repeated and oneof fields, `map` keys and values, and the same fields of generated views, lazy views and owned views. A policy can keep base64 scratch storage under a wipe owner, or refuse export while still accepting import. JSON `null` keeps its protobuf meaning for each field shape and never reaches the policy. Unlisted custom types are unchanged. Configuration fails closed: a listed type that no unshadowed representation rule selects is `CodeGenError::JsonPolicyTypeMatchedNothing`, a representation path that names a listed type with a different spelling is `CodeGenError::JsonPolicyTypeNearMiss`, and a listed `string` type used as the key of a map with enum values is `CodeGenError::JsonPolicyMapKey`. A listed type while JSON generation is off produces `CodeGenWarning::JsonPolicyTypesRequireJson`.
time: 2026-11-13T12:00:00+01:00
