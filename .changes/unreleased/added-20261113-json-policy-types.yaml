kind: Added
body: |-
    **Custom byte and string representations can own their protobuf JSON encoding** through the new `buffa::json_helpers::ProtoBytesJson` and `ProtoStringJson` traits. List a type with `buffa_build::Config::json_policy_type` (plugin option `json_policy_type=<rust_type>`, repeatable), and its generated JSON goes through the trait: singular, optional, repeated and oneof fields, `map` keys and values, and the same fields of generated views, lazy views and owned views. Generated code implements no trait for a listed type's JSON, so with JSON alone it may be defined, with its representation and policy impls, in another crate and shared by separate generation runs into one crate; vtable reflection still requires a crate-local type generated in one run for `repeated` and `map` uses. List the type in every run that generates a field of it. A policy can keep base64 scratch storage under a wipe owner, or refuse export while still accepting import. Policies do not provide whole-message erasure: repeated fields stage values in an ordinary Vec before conversion, and outer containers, parser scratch and serializer output retain their own storage behavior. Generic map-key parse errors use a fixed reason rather than forwarding a custom parser error that might contain the key. A policy used for map keys must round-trip, and so be injective, or entries are lost or come back altered. JSON `null` keeps its protobuf meaning for each field shape and never reaches the policy. Unlisted custom types are unchanged. Configuration fails closed: a listed type that no unshadowed representation rule selects is `CodeGenError::JsonPolicyTypeMatchedNothing`, a representation path that names a listed type with a different spelling is `CodeGenError::JsonPolicyTypeNearMiss`, and a listed `string` type used as the key of a map with enum values is `CodeGenError::JsonPolicyMapKey`. A listed type while JSON generation is off produces `CodeGenWarning::JsonPolicyTypesRequireJson`. Only the generated serde impls consult a policy, so a policy is not a confidentiality boundary: binary encoding, text format and reflection never call it, and reflection, whether through `DynamicMessage` or a generated message converted to one (`DynamicMessage::try_from_message` works without generated reflection), reads and writes the field as standard base64 or a plain string, so a policy that refuses export does not stop reflective JSON from printing the value and its import checks do not run. Generating fields using policy types while JSON and reflection are both generated produces `CodeGenWarning::JsonPolicyReflectionBypass { policy_types }`, naming the sorted, distinct types selected by this run; unused rules for other directories do not trigger it. Equivalent type spellings (whitespace, redundant type parentheses, turbofish and raw identifiers) share policy matching and implementation deduplication keys; this does not resolve Rust aliases.
time: 2026-11-13T12:00:00+01:00
