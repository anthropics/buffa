kind: Added
body: |-
    **`buffa::json_helpers::ProtoBytesJson` and `ProtoStringJson`** let a custom byte or string representation define its own protobuf JSON encoding, for example to keep base64 scratch storage under a wipe owner or to accept a value on import while refusing to print it. The traits receive the field's borrowed `&[u8]` or `&str`, so one implementation serves owned messages and views alike. Hidden serde helpers for singular, optional, repeated, map-key and map-value positions are included for generated code, so generated code needs no JSON trait impl for the policy type and, for JSON, the type may come from another crate (vtable reflection still needs a crate-local type in `repeated` and `map` positions); JSON `null` keeps its protobuf meaning for each field shape and never reaches the policy, and a `null` repeated element or map value is rejected. This is the runtime API; automatic policy selection and generated routing require companion codegen, build and plugin support. Explicit serde helpers can be used without that support. Policies do not provide whole-message erasure: repeated fields stage values in an ordinary Vec before conversion, and outer containers, parser scratch and serializer output retain their own storage behavior. Reflection, whether through `DynamicMessage` or a generated message converted to one, reads and writes the field as standard base64 or a plain string, so a policy that refuses export does not stop reflective JSON from printing the value. Generic map-key parse errors use a fixed reason rather than forwarding a custom parser error that might contain the key. A policy used for map keys must round-trip, and so be injective, or entries are lost or come back altered.
