kind: Added
body: |-
    **`DynamicMessage::set_fields`** (#432, item 2) is an inherent, non-`dyn` counterpart to `ReflectMessage::for_each_set`: an iterator over the same set fields, in the same ascending field-number order, but yielding `&Value` borrowed directly from `&self` instead of a value handed through `for_each_set`'s `&mut dyn FnMut(&FieldDescriptor, ValueRef<'_>)` callback, whose lifetime is generic per call. Prefer it for an iterative (non-recursive) walk over nested messages, where a `Value::Message` needs to outlive the visit that produced it — `collect`ing `set_fields()` into a worklist keeps a borrowed `&DynamicMessage` usable after the loop, which does not borrow-check through `for_each_set`. Behaviour is otherwise identical to `for_each_set`: same presence rule, extensions visited alongside declared fields the same way, unknown fields excluded the same way.
