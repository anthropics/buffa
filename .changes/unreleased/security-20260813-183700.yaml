kind: Security
body: |-
    **View and reflective decoders now merge a repeated message value within one map entry, matching the owned decoder** (#365). For a `map<K, SomeMessage>` field, protobuf merge semantics say that if a single map entry carries its value field more than once, the occurrences merge into one message. The owned decoder did that, but generated `*View` types (including lazy views and `buffa_types::StructView`) and `DynamicMessage` kept only the last occurrence — a parser differential that let a crafted message show different map contents to a view-based check than to owned decoding or JSON transcoding of the same bytes. All decoders now merge. No conforming encoder emits a split value (message concatenation produces separate entries, which are unaffected), so only hand-crafted input decodes differently, and it now decodes the same way everywhere. Who needs to act: `buffa-build` users pick up the fix on the next build after upgrading; `protoc-gen-buffa` / `buf generate` users who commit generated code must reinstall the plugin, regenerate, and commit — upgrading the `buffa` crate alone leaves the old view decoder in place; `DynamicMessage` and `buffa-types` users only upgrade.
