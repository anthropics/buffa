kind: Fixed
body: '**DescriptorPool keeps repeated messages as lists when their names match local map entries.** Map detection uses the resolved message name, so an unrelated `Other.ItemsEntry` no longer inherits the key and value types of a local `items` map. Reflective binary and JSON codecs now use the correct list representation for these fields.'
