kind: Fixed
body: |-
    **A sub-message or map entry whose declared length runs past the message that holds it is now rejected with `DecodeError::UnexpectedEof` before it is decoded, including an empty payload whose length prefix crosses that boundary.** Such a length was checked only against the rest of the input, so the nested message was decoded from the parent's following bytes (into the destination, on a `merge`) before the parent noticed the overrun, and its fields were bounded by the whole input rather than by `DecodeOptions::with_max_message_size`. `DecodeContext` now records where the message being decoded ends, through the new `DecodeContext::with_message_end`, which the default `Message::merge_to_limit` calls with its limit. A direct `merge_to_limit` caller can therefore get this error where it previously got `Ok` with the buffer past its limit. Hand-written code that decodes a different buffer, such as a copy or a decompressed payload, with a context it was given must record that buffer's end with `with_message_end` (`0` for a buffer that holds exactly the message) or start it with `Message::merge`, or a valid nested field near its end can be rejected. Checked-in generated code gets the bound for custom string and bytes fields once it is regenerated.
time: 2026-11-17T12:00:00+01:00
