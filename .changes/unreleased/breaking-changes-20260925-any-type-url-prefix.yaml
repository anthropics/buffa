kind: Breaking changes
body: |-
    **`google.protobuf.Any` registries match a registered message under any type-URL prefix** (#485). A type registered as `type.googleapis.com/pkg.Message` is now also found for `company.example/v1/pkg.Message`: when a URL is not itself registered, JSON and text lookups use the message full name after its last `/`, which is how `Any` identifies its message. A registered URL still finds its own entry. When one message is registered under several URLs, a lookup under any other prefix uses the most recently registered one. The `Any` keeps the `type_url` it was given, on parse and on output.
    This changes what is written and how existing input is read. An `Any` whose prefix is unregistered but whose message is registered used to serialize in the fallback form (base64 `value` in JSON, `type_url` and `value` fields in text) and now serializes expanded. Text expands only a URL made of ASCII letters, digits and `-._~/:%`; any other URL, registered or not, prints as a quoted `type_url` field. JSON that an earlier release wrote in the fallback form for such an `Any` is now read as the expanded form of the registered message, so its payload is dropped, rejected or misread: re-serialize stored documents, and upgrade readers and writers together. A payload under another prefix is decoded as the registered message: one that does not decode as it now fails to serialize as JSON, and one that does is written with that message's fields. `Any::is_type` and `Any::unpack_if` are unchanged and compare the whole URL; `Any::is_message` and `Any::unpack_message` (#499) match by name under any prefix.
    `TextDecoder::read_any_expansion` returns the type URL as `Cow<'a, str>` instead of `&'a str`, owned when whitespace or comments were removed from it. Only a hand-written `TextFormat` impl calls this method. One that converts the URL with `.into()` or `.to_string()` compiles unchanged; one that keeps it as `&'a str` needs `.into_owned()` or a borrow.
time: 2026-09-25T11:05:00+02:00
