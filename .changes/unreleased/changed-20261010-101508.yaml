kind: Changed
body: |-
    **A `google.protobuf.Any` whose `type_url` is a bare message full name is read as that message** (#692). `any.proto` requires a `/` in a type URL, but protobuf-go and Python resolve a string without one as a full name, and so did `DynamicMessage`. The generated `Any` now does the same. Its JSON parser accepts `{"@type": "pkg.Message", ...}` when the type registry has a JSON entry for `pkg.Message`, `AnyRegistry::lookup` and `TypeRegistry::json_any_by_url` find a registered message by its bare name, and an entry registered under a bare name is found under any URL prefix.
    This changes JSON output. An `Any` with a bare name and a registered message was written as `{"@type": "pkg.Message", "value": "<base64>"}`, which the generated parser rejected, and is now written with the fields of the message; a payload that does not decode as that message now fails to serialize. A bare name without a JSON entry is still a parse error, and so is an `@type` that is empty or ends in `/`. Text format is unchanged: it does not resolve a bare name to a registered message, because `[pkg.Message] { ... }` is the syntax of an extension field.
