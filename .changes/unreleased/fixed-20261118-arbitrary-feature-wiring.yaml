kind: Fixed
body: 'Make the `buffa-types` and `buffa-descriptor` `arbitrary` features enable the standard-library support required by their generated derives and map representations. Builds with defaults disabled and arbitrary enabled now compile independently on native and Wasm targets; ordinary builds without these features retain no_std support. The isolated feature-check script uses the repository''s toolchain and configuration even when invoked from another directory.'
