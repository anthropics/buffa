kind: Breaking changes
body: '**A message or enum named `bool`, `i32`, `i64`, `f32`, `f64`, `usize` or `u8` is generated with a trailing underscore** (#556). Such a type compiled before only in a package whose generated code did not use that primitive: for the first five, a package with no field of that scalar type; for `u8`, a build with views off. Rename uses of the generated type: `pkg::bool` becomes `pkg::bool_`, and its view `boolView` becomes `bool_View`. A crate that reaches such a type through a prefix-mapped `extern_path` regenerates together with the crate that owns it.'
time: 2026-10-04T10:56:45.726473047-07:00
