kind: Added
body: |-
    **`(buffa.ext.message).name` and `(buffa.ext.enum).name` set the Rust name of a struct or an enum** (#557). A schema that imports `buffa/ext/options.proto` can write `option (buffa.ext.message).name = "Kind";` in `message Type`, and the generated struct is `Kind`, its view is `KindView`, and every reference to the message uses `Kind`. buffa uses the value as written: it does not escape it and does not add `type_name_prefix` to it. A crate that reaches the type through an `extern_path` prefix reads the option from the imported file, so the mapping stays as it is. `FULL_NAME`, type URLs, JSON, the text format and the descriptor keep the proto name. The value must be an ASCII Rust identifier that is not a keyword, is not `__buffa`, does not start with `__buffa_`, and is not a primitive type name that generated code uses; any other value fails with `CodeGenError::InvalidNameOption`, whose `problem` can be the new `NameOptionProblem::PrimitiveType`. A value that another message or enum in the same package or parent message already has as its Rust name fails with `CodeGenError::NameOptionConflict`. The `CodeGenError::TypeNameConflict` message now also names the two options as a fix.
time: 2026-10-04T11:40:00-07:00
