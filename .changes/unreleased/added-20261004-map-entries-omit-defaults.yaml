kind: Added
body: |-
    **Generated messages can encode map entries as prost does** (#562). The option is `buffa_build::Config::map_entries_omit_defaults`, `map_entries_omit_defaults=true` in `protoc-gen-buffa`, and `CodeGenConfig::map_entries_omit_defaults`; it is off by default. A key or value at its default (zero, `false`, empty, an open enum's 0, a closed enum's first value, or a message value that encodes to nothing) is left out of the entry by the owned, view and lazy view encoders; the entry itself is kept. Decoding is unchanged; as with prost, a `-0.0` float value is left out and so decodes as `0.0`. A message value that equals its default but still encodes a field, such as a `required` field at its default, is written, where prost leaves it out. For maps with several entries to come out in prost's `btree_map` order, also use `map_type(MapRepr::BTreeMap)`. Each crate's types encode as that crate was generated; the well-known types and `DynamicMessage` write both fields, and under `CodecStrategy::Table` messages with a map field keep the unrolled codec, and a `codec_strategy_in` rule that selects the table for such a message by its exact path is an error.
