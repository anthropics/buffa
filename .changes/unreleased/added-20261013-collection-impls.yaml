kind: Added
body: |-
    **`Struct` gains `len`, `iter`, `IntoIterator` and related methods, and `Struct`, `ListValue` and `FieldMask` gain `Extend`** (#712, closes #704). `Struct` gains `len`, `is_empty`, `contains_key`, `iter`, `iter_mut`, `IntoIterator` for `&Struct`, `&mut Struct` and `Struct` (yielding the new `StructIter`, `StructIterMut` and `StructIntoIter`), and `Extend<(K, V)>` with the bounds of `from_fields`; an extended key that is already present takes the new value, as `insert` does. `ListValue` gains `Extend<V: Into<Value>>` and `FieldMask` gains `Extend<T: Into<String>>`, which appends without normalizing, as `from_paths` does. `Struct::fields` is a hash map, so `Struct`'s iteration order is unspecified.
