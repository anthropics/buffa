kind: Fixed
body: |-
    **`buffa_build::Config::compile` rejects a path-qualified `include_file` with `shared_descriptor_pool`, and with an explicit `out_dir`** (#611).
    The shared pool's sidecar is named after the include file's stem alone and written at the output root. In `$OUT_DIR` mode, `a/gen.rs` and `b/gen.rs` from two `compile` calls therefore shared one sidecar, and one tree read the other's descriptors; the documented bare-file-name requirement is enforced, so a single nested include file with the shared pool, which built, is rejected too. With an explicit `out_dir` the include file names the package files by paths relative to itself, so `.out_dir("src/gen").include_file("nested/mod.rs")` wrote an include file whose `include!` paths did not resolve, with the shared pool on or off; `compile` returns an error for that as well. In both cases the rule is a bare file name, optionally after `./`, so an absolute path into `out_dir` and `sub/../mod.rs`, which named a file in `out_dir` and worked, are rejected too: pass the file name. In `$OUT_DIR` mode without the shared pool a nested include file is accepted as before, and `compile` creates its directory.
