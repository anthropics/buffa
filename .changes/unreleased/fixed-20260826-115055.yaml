kind: Fixed
body: Generated JSON serialization for message-valued oneof variants now dereferences the configured `ProtoBox` before passing the value to serde. Custom `ProtoBox` types no longer need to implement `serde::Serialize` just because they are used in a oneof, and the custom-types example now exercises the `ProtoBox` contract without that workaround.
time: 2026-08-26T11:50:55+02:00
