kind: Added
body: |-
    **`buffa-proto-options` crate and `buffa/ext/options.proto`** (#496). The new file declares buffa's own custom options, one for each kind of element that buffa generates Rust for: `(buffa.ext.file)`, `(buffa.ext.message)`, `(buffa.ext.field)`, `(buffa.ext.oneof)`, `(buffa.ext.enum)` and `(buffa.ext.enum_value)`. Each option is a message and each message is empty in this release, so setting one has no effect yet: a later release adds a setting as a field of the message. All six use extension number 1381, from the range 1381-1390 that buffa has reserved in the protobuf global extension registry. The `buffa-proto-options` crate ships the `.proto` file, in its `protos/` directory and as the constant `buffa_proto_options::OPTIONS_PROTO`, and the Rust types generated from it: the option messages and the extension constants (`buffa_proto_options::FIELD` and the rest) that read an option from a descriptor through `buffa::ExtensionSet`. The view, JSON, text, `arbitrary` and reflection impls need the `views`, `json`, `text`, `arbitrary` and `reflect` crate features.
