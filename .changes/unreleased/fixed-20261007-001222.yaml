kind: Fixed
body: |-
    **Text format keeps the elements of a repeated message or group extension apart** (#584). For a repeated extension whose elements are messages or groups, the text encoder merged every element into one and printed only that, and the decoder rejected the list form `[pkg.ext]: [{..}, {..}]`. Each element is now printed as its own `[pkg.ext] { .. }` entry, as C++ and Go print them, and the decoder also accepts the list form. Binary and JSON already kept the elements apart.
    The fix reaches a crate when its code is regenerated, and regenerated code needs this runtime: it registers four new helpers in `type_registry` (`repeated_message_encode_text`, `repeated_group_encode_text`, `repeated_message_merge_text`, `repeated_group_merge_text`). Code generated by an earlier release parses the per-element output.
