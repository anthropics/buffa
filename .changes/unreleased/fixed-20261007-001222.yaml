kind: Fixed
body: |-
    **Text format keeps the elements of a repeated message or group extension apart** (#584). For a repeated extension whose elements are messages or groups, the text encoder merged every element into one message and printed only that, and the decoder rejected the list form `[pkg.ext]: [{..}, {..}]`. Each element is now printed as its own `[pkg.ext] { .. }` entry, as C++ and Go print them, and the decoder accepts the list form as well as one entry per element. Binary and JSON already kept the elements apart. Text output for such an extension with two or more elements changes, so golden files that hold the merged form need updating.
    The fix is in generated code: regenerate any crate that declares such an extension with `generate_text` enabled. Until then it keeps printing the merged message and rejecting the list form. Regenerated code needs this release of `buffa`, because it calls four new functions in `type_registry` (`repeated_message_encode_text`, `repeated_group_encode_text`, `repeated_message_merge_text`, `repeated_group_merge_text`) and does not compile against an earlier one. Code generated by an earlier release reads the per-element output as separate elements. The one output it rejects is `[pkg.ext]: []`, which the new encoder writes when the message holds records at the extension's number and every one fails to decode as the element type; earlier releases printed `[pkg.ext] {}` there, which read back as one empty element.
