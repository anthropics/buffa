kind: Changed
body: |-
    **FieldMask JSON validates each path in one pass, without allocating** (#585). Checking that a path survives the `snake_case` to `lowerCamelCase` round trip built two `String`s per path; the check now reads the path's bytes once. The typed and the reflective JSON codecs accept and reject the same paths as before.
