kind: Changed
body: |-
    **`text::unescape_str` borrows a literal that is followed by a comment** (#528). An escape-free literal followed only by whitespace was already returned as `Cow::Borrowed`; one followed by a `#` comment was copied. The textproto decoder passes the literal without what follows it, so this changes only direct calls to `unescape_str`.
