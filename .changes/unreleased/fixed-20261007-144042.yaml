kind: Fixed
body: |-
    **`extension()` on a repeated message or group extension stops at the default element-memory budget and returns the elements decoded before it** (#613). Each element is charged its `size_of` against `DEFAULT_ELEMENT_MEMORY_LIMIT` (32 MiB) before it is built, as the generated decoder charges a repeated message field, and one budget covers every record of the extension together with what the elements allocate inside. Before, only the allocations inside each element were charged, so a list of empty messages could grow the returned `Vec` past the limit. The getter has no error channel, so a list that exceeds the budget comes back shorter instead of failing: the getter stops at the first element that exceeds the budget. To detect that, compare the returned length with the number of unknown-field records that have the extension's number. The budget is the crate default whatever `DecodeOptions` decoded the carrier. A malformed element is skipped, as before. A charge is never refunded, also for a skipped element, so the budget bounds the element storage that one call builds; the contents of strings and bytes are outside it.
