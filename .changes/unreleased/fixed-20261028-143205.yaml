kind: Fixed
body: |-
    **Generated JSON writes a `google.protobuf.NullValue` field as `null` outside a oneof too, and `null` sets an optional one** (#806). `optional`, `required`, repeated and map fields of type `NullValue` wrote the enum name `"NULL_VALUE"` in owned and view serialization, an implicit-presence field holding an unknown number wrote the number, and `{"f": null}` left an explicit-presence field unset, so the value was lost on the next binary encode. Only oneof members and extensions followed ProtoJSON, which writes every `NullValue` as `null` and reads `null` as a present `NULL_VALUE`. Generated code and `DynamicMessage` now agree for all field shapes. The parse side still accepts `"NULL_VALUE"` and `0`. Codegen routes these fields through new `json_helpers` modules (`null_value`, `opt_null_value`, `repeated_null_value`, `map_null_value` and `bytes_key_null_value_map`), so code generated by this version needs a matching `buffa`.
time: 2026-10-28T14:32:05+03:00
