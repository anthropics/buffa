kind: Fixed
body: '**Fix ProtoJSON parsing for primitive wrapper values** (#368). Primitive wrappers now use the same scalar parsing rules as generated fields, including direct deserialization of `null` as the default value. Repeated and map wrapper values reject null elements. External messages routed through a ProtoJSON container helper, including bytes-keyed map values, must implement `buffa::json_helpers::ProtoElemJson`. Bytes-keyed maps now apply the same ProtoJSON encoding to values, including quoted `int64` values.'
