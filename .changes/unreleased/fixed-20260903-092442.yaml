kind: Fixed
body: '**`SharedCorpusContext::check()` now compares full corpus content, not just file names** (#401). A same-named file with different content (e.g. after regenerating a `FileDescriptorSet` from an edited `.proto`) previously passed the mismatch check and could silently reuse oneof/inlining decisions and comments resolved against the old content — `SharedCorpusContext` carries no lifetime tying it to the caller''s `files`, so name-only comparison was not a sound fingerprint. The check is now `O(corpus)` per `generate()` call regardless of whether anything actually changed; measured at roughly 25-28% added wall/CPU time on a ~2900-crate workspace versus the name-only comparison, still a substantial net win over not sharing the context at all.'
