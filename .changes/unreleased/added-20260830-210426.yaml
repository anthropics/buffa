kind: Added
body: '**`CodeGenConfig::shared_descriptor_pool_root`**: override the computed `super::`-relative path to the shared `__buffa_fds` root in [shared-pool mode](CodeGenConfig::shared_descriptor_pool) with a caller-supplied path, for workspaces where one crate does not host the whole package tree as nested modules (e.g. one independent Cargo crate per proto package). `None` (the default) keeps the existing `super::`-relative behavior — purely additive, no change to any existing consumer.'
