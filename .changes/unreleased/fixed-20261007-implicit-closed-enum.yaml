kind: Fixed
body: |-
    **`DescriptorPool` rejects a singular enum field with implicit presence whose enum is closed** (#609). Such a field linked. It is a field of an editions file whose `features.field_presence` resolves to `IMPLICIT`, which protoc rejects with "Implicit presence enum fields must always be open." A map whose value type is a closed enum is rejected the same way when its entry has implicit presence, and the error names the `value` field of the entry message. Only hand-built or synthesized descriptor sets can reach this, because protoc rejects the file. The rejection is the new `PoolError::ImplicitPresenceClosedEnum` variant.
    Repeated fields, oneof members and extensions of an editions file that name a closed enum are valid and link as before. A proto3 file is held to a wider rule: every field and extension that names a closed enum is rejected as `PoolError::Proto3ClosedEnumField` (#695).
time: 2026-10-07T10:30:00+02:00
