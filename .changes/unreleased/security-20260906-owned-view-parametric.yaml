kind: Security
body: |-
    **A hand-written `MessageView` used through `OwnedView` could produce a use-after-free from safe code** (#381, closes #376). `OwnedView::decode` hands the view a buffer slice whose lifetime is forged to `'static`, and `MessageView` is a safe, unsealed trait with no requirement that an implementation be parametric in that lifetime; a hand-written `impl MessageView<'static> for MyView` — or its own `Debug`, `PartialEq`, `Serialize` or `Clone`, which `OwnedView` invoked on the `'static`-typed value — could copy a `&'static str` out of the buffer into longer-lived storage and read it after the `OwnedView` dropped. Every `OwnedView` constructor now requires the `unsafe` marker `ViewLifetimeParametric`, so the forged slice never reaches a view that has not asserted the contract, and `OwnedView`'s own trait impls route through `reborrow()`. Generated views were never exposed: every codegen-emitted `FooView<'a>` is parametric in `'a`, and no wire input reaches this. Reported by HackerOne researcher waynezinn.
time: 2026-09-06T09:00:00+00:00
