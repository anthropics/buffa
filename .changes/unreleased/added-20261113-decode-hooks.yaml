kind: Added
body: |-
    **Custom string and byte representations can decode their own binary payloads** by overriding the new `ProtoString::decode_length_delimited` and `ProtoBytes::decode_length_delimited` methods. buffa reads and validates the field's length prefix, then hands the method an opaque `FieldPayload` implementing `Buf`, bounded to exactly that field, so an override never handles the prefix or the surrounding input. Generated code decodes these fields through the new `types::decode_string_to_ctx` and `types::decode_bytes_to_ctx`, which check the length against the end of the message that holds the field before the override runs, so the window never reaches the following field, a later frame of a stream, or past `DecodeOptions::with_max_message_size`; the context-free `decode_string_to` and `decode_bytes_to` check it against their input only. A representation can copy a fragmented field straight into its own storage, for example memory that is wiped on drop, instead of through an intermediate `Bytes`. The defaults keep the existing `from_wire` behavior and zero-copy paths. The field window stays bounded if a delegated default decoder rejects an owned or fragmented payload, so a hook can inspect, retry or recover without seeing the next field. A length prefix that crosses the enclosing message boundary is rejected even when it decodes to zero; valid empty payloads and supported noncanonical zero prefixes within that boundary remain accepted.
