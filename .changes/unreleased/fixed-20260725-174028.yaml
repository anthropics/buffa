kind: Fixed
body: |-
    **JSON `null` on a registered extension key unsets the extension** (#355), for both singular and repeated extensions. Singular `google.protobuf.Value` and `google.protobuf.NullValue` extensions are the exception: `null` is a present value there. A `NullValue` extension now also serialises as `null` rather than the enum name `"NULL_VALUE"` (`[null, …]` when repeated), matching the reflective codec and ProtoJSON; the parse side accepts `null`, `"NULL_VALUE"`, and `0`. Generated extension registrations reach that behaviour through four new `extension_registry::helpers` functions (`null_value_to_json`, `null_value_from_json`, and their `repeated_` forms), so code generated by this version needs a matching `buffa`.
