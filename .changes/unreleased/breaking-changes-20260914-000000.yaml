kind: Breaking changes
body: |-
    **`ProtoString` uses `copy_from_str(&str)` instead of requiring `for<'a> From<&'a str>`** (#442, closes #441). This lets string libraries retain borrowing `From<&str>` conversions while copying temporary JSON inputs for non-optional singular fields, and borrowed view text in view-to-owned conversions of custom-representation string fields, into owned storage. The new method defaults to `From<String>`; override it to avoid the intermediate allocation for inline/shared strings. The remote derive and `buffa-smolstr` example preserve their direct borrowed-text construction path.
    A custom string type that relied on an efficient `From<&str>` (for example inline storage for short strings) and does not override `copy_from_str` now pays an intermediate `String` allocation when a view converts to an owned message (singular, optional, repeated and oneof string fields; map keys and values already went through `From<String>`) and when JSON deserialization of a non-optional singular field receives borrowed text, because the default can no longer call `From<&str>`; such a type still compiles and produces the same values. Override `copy_from_str` to restore the fast path. Types that use `#[derive(buffa_remote_derive::ProtoString)]` need no change: the derive forwards `copy_from_str` to the remote type's `From<&str>`.
    Generic callers that relied on `S: ProtoString` to imply `From<&str>` should use `S::copy_from_str(value)` or add an explicit conversion bound. `json_helpers::proto_string::deserialize` now requires `ProtoString`, not just the two `From` conversions; hand-written users of that helper must implement the trait or use their own deserializer. Regenerate custom-string view code before using a representation without the old bound. Binary decoding, wire format, and default `String` code generation are unchanged.
