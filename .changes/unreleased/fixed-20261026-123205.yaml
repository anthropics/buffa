kind: Fixed
body: |-
    **`DescriptorPool` rejects misplaced features and legacy syntax in editions files** (#800, part of #633). The pool linked these editions files, which protoc rejects, without an error. Each case is a new `PoolError` variant that names the field or file. A group field is `PoolError::GroupFieldInEditions`: editions declare a message field with `features.message_encoding = DELIMITED` instead. The `packed` option, set to either value, is `PoolError::PackedOptionInEditions`: editions spell `packed = true` as `features.repeated_field_encoding = PACKED`, the edition default, and `packed = false` as `EXPANDED`. `PoolError::InvalidFieldPresence` is `features.field_presence` set on a oneof member, a repeated or map field or an extension, or set to `IMPLICIT` on a message field; an extension set to `LEGACY_REQUIRED` still reports `PoolError::RequiredExtension`. `PoolError::InvalidUtf8Validation` is `features.utf8_validation` on a field that is neither a string field nor a map with a string key or value. `PoolError::InvalidMessageEncoding` is `features.message_encoding` on a map field or on a field that is not a message field. `PoolError::LegacyRequiredFileDefault` is `features.field_presence = LEGACY_REQUIRED` in the file's own options.
    As in protoc, a field rule counts only a feature that the field sets itself, so a file default applies to the fields it fits and passes over the rest. A field rule also skips the `key` and `value` fields of a map entry, which carry a copy of the map field's features. The rules apply to edition 2023 and later; like protoc, the pool does not apply them to a file with syntax `editions` and an earlier edition.
    protoc rejects each of these files, so only hand-built or synthesized descriptor sets are affected. `buffa-codegen` does not apply these rules, so with `generate_reflection` the generated `descriptor_pool()` panics on first use for such a set (#626 covers the descriptors that codegen accepts and the pool rejects).
