kind: Fixed
body: |-
    **`Any` JSON parsing no longer drops data it cannot read for a type with no registry entry** (#498, closes #487). `Any` has an expanded JSON form, `{"@type": "...", "field": ...}`, which carries the message's own JSON and needs the message's JSON entry in the `TypeRegistry`. For a type without that entry, a `value` that was not a string and any key other than `@type` and `value` were dropped silently, so the expanded form parsed to an `Any` without its fields. Both are now errors, and a `value` string that is not base64 reports the same cause; the messages contain `has no JSON entry in the type registry` or `no type registry is installed`.
    The error applies whether or not the surrounding message ignores unknown JSON keys, and it is not configurable, so one `Any` of an unregistered type in expanded form fails the whole parse (an entry in `google.rpc.Status.details`, for example). Register every message type the input can carry in an `Any`: each package's generated `__buffa::register_types` and `buffa_types::register_wkt_types`, then `buffa::type_registry::set_type_registry`; the guide's "Any" section has the details.
    Unchanged: the buffa-specific form `{"@type": "...", "value": "<base64>"}` that buffa writes for such a type still parses, a missing or `null` `value` is an empty payload, and a string `value` that is valid base64 is always taken as the encoded message.
