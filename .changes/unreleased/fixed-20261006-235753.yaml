kind: Fixed
body: |-
    **An implicit-presence `float` or `double` field holding `-0.0` is written to JSON and reported as set by generated reflection** (#577). An implicit-presence field (a proto3 field without `optional`, or an editions field with `field_presence = IMPLICIT`) is omitted from JSON only at its default, and for a floating-point field the default is `+0.0` alone. The predicates that the generated `Serialize` impls of messages and views call, `json_helpers::skip_if::is_zero_f32` and `is_zero_f64`, compared the value with `0.0`, so `-0.0` was omitted and a JSON round trip turned it into `+0.0`; vtable-mode `ReflectMessage::has` and `for_each_set` reported the field unset for the same reason. The predicates and the reflection code now compare the bit pattern, as the binary and text encoders and `DynamicMessage` already did, and as protobuf-go and C++ do.
    JSON output changes only for a message holding `-0.0` in such a field: `{}` becomes `{"ratio":-0.0}`. Output for `+0.0`, for `optional` fields, and for repeated and map elements is unchanged. Arithmetic can produce `-0.0` (`-1.0 * 0.0`, negating `0.0`, a negative value that rounds to zero), so a golden file can change for a computed field; store `x + 0.0` where the sign carries no meaning. The JSON change is in the runtime, so it reaches code generated by an earlier release without regenerating. The reflection change needs regenerated code; it also covers `FloatValue` and `DoubleValue` in `buffa-types`.
