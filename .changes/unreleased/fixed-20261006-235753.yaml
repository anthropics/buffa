kind: Fixed
body: |-
    **An implicit-presence `float` or `double` holding `-0.0` is written to JSON and reported as set by generated reflection** (#577). The JSON serializers of generated messages and views compared the value with `0.0`, so `-0.0` was omitted and came back as `+0.0`. `ReflectMessage::has` and `for_each_set` on a generated message or view skipped the field for the same reason. Both now compare the bit pattern, as the binary and text encoders and `DynamicMessage` already did, and as protobuf-go and C++ do. `json_helpers::skip_if::is_zero_f32` and `is_zero_f64` return `false` for `-0.0`; code generated by an earlier release calls them by path and picks the JSON change up from the runtime.
time: 2026-10-06T23:57:53.138663+02:00
