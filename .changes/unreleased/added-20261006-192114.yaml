kind: Added
body: |-
    **`buffa-remote-derive`: a `serde` key that derives `Serialize` and `Deserialize` for the newtype** (#590, refs #290). A bare `serde` key, as in `#[buffa(remote = ecow::EcoString, serde)]`, makes any of the five derives emit both serde impls. A `ProtoString` newtype reads and writes a JSON string and a `ProtoBytes` newtype a base64 string, through `buffa::json_helpers`, so the remote type needs no serde support of its own. Both reject JSON `null`, which proto3 JSON forbids as a `repeated` element or a map value. `ProtoList`, `ProtoBox` and `MapStorage` newtypes call the wrapped type's own serde impls, so the remote crate needs its `serde` feature.
    Message code generated with `generate_json(true)` calls a custom string type's serde impls when the type is a `repeated` element, an `optional` field, a oneof variant, or a map key or value, and a custom list's or map's impls when it holds strings, bools or messages. The key replaces the hand-written impls those positions needed. The impls are emitted unconditionally, so a crate whose `serde` dependency is optional writes `#[cfg_attr(feature = "serde", buffa(serde))]`. The crate that defines the newtype depends on `serde` directly, and on `buffa` with its `json` feature for the string and bytes forms.
