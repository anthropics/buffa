kind: Added
body: |-
    **`buffa-remote-derive`: a `serde` key that derives `Serialize` and `Deserialize` for the newtype** (#590, refs #290). A bare `serde` key, as in `#[buffa(remote = ecow::EcoString, serde)]`, makes any of the five derives emit both serde impls. A `ProtoString` newtype reads and writes a JSON string and a `ProtoBytes` newtype a base64 string, so the remote type needs no serde support of its own. Both reject JSON `null`, which proto3 JSON forbids as a `repeated` element or a map value. `ProtoList`, `ProtoBox` and `MapStorage` newtypes call the remote type's own serde impls, so the remote type's crate needs its `serde` feature.
    Message code generated with `generate_json(true)` calls a custom string type's serde impls when the type is a `repeated` element, a field with explicit presence (`optional`, or a singular field under the edition 2023 default), a oneof variant, or a map key or value. It calls a custom list's impls for a `repeated` field of strings, bools or messages other than the `google.protobuf` wrapper types, and a custom map's impls for a string-keyed map of those. The key replaces the hand-written impls those positions needed; remove an existing `#[derive(serde::Serialize, serde::Deserialize)]` and `#[serde(transparent)]` when adding it. The impls are emitted unconditionally, so a crate that puts JSON behind a feature writes `#[cfg_attr(feature = "json", buffa(serde))]`. The crate that defines the newtype depends on `serde` directly, and a `ProtoBytes` newtype also needs `buffa` with its `json` feature.
