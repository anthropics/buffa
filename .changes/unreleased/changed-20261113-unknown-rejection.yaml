kind: Changed
body: |-
    A zero unknown-field allowance rejects wire occurrences independently of storage, including discarded groups, map fields and unknown closed-enum occurrences in generated and reflective `DynamicMessage` decoding. This changes a zero allowance from a storage-only budget into explicit rejection, including `DecodeContext::new` with a zero allowance. To discard unknown fields without rejecting them, generate with unknown-field storage disabled and keep a positive or default allowance. Positive allowances retain their storage-budget semantics. Regenerate existing bindings with a matching updated generator before relying on rejection: older generated code can discard unknowns without consulting the context, and a runtime-only upgrade cannot enforce the policy there. Hand-written decoders must use `skip_unknown_field` / `DecodeContext::check_unknown_field` when discarding unknown occurrences. Static generated extensions and MessageSet payloads are unknown fields too; deferred lazy children validate only when materialized.
time: 2026-11-13T09:04:51+01:00
