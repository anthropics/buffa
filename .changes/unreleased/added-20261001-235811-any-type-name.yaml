kind: Added
body: >-
  **`Any::type_name`, `Any::is_type_name`, and `Any::unpack_if_type_name` match
  an embedded message by the non-empty type-name segment after the last `/`.**
  This works with custom type URL prefixes. Existing URL-specific methods still
  compare the full URL.
