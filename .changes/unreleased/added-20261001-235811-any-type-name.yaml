kind: Added
body: >-
  **Add type-name and typed pack/unpack helpers for `Any` (#499).** `type_name`,
  `is_type_name`, and `unpack_if_type_name` match custom type URL prefixes.
  `pack_message`, `try_pack_message`, `is_message`, and `unpack_message` use
  `MessageName`; existing explicit-URL methods remain available.
