kind: Fixed
body: '**A message whose nested-types module name is not available now generates code that compiles** (#560). The module that holds a message''s nested types is `snake_case(Name)`. It now gets a trailing underscore when a generated type in the same scope has that name (`message item` declares `pub struct item`, so its nested types are in `item_`), when the name is `self`, `super`, `crate` or `arbitrary` (`message Crate`: `crate_`), and for a top-level message when it is `oneof`. Each of these failed to compile once the message contained a nested message, a nested enum, an `extend` block or a oneof: `Arbitrary` under `generate_arbitrary` with the `arbitrary` feature on, and `Oneof` with views on. A per-type `extern_path` entry for such a message resolves its nested types to the same module.'
time: 2026-10-04T12:27:02.250822287-07:00
