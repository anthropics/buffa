kind: Added
body: |-
    **Path-scoped unknown-field preservation** (#395, closes #281). `buffa_build::Config::preserve_unknown_fields_in` (plugin option `unknown_fields_in=<path>`, repeatable; `CodeGenConfig::preserve_unknown_fields_in`, a `Vec<(String, bool)>` of `(path, enabled)` rules) re-enables unknown-field preservation for matching messages on top of the global `preserve_unknown_fields` default, so a build can keep the memory savings of `preserve_unknown_fields(false)` while selected types still round-trip. Paths use the same proto-segment prefix matching as `unbox_oneof_in` and the last matching rule wins: a rule covers the message it names and the messages nested inside it, but not the enclosing message. A message that does not preserve unknown fields also has no `ExtensionSet` impl, `ReflectMessage::unknown_fields`, textproto extension round-trip, or JSON `[ext]` keys. A rule that matches no generated message produces a new `CodeGenWarning::PreserveUnknownFieldsRuleMatchedNothing`.
