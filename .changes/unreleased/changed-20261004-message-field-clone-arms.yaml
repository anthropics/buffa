kind: Changed
body: |-
    **Cloning a message no longer copies the storage of unset nested message fields** (#552, refs #549). `MessageField::clone` cloned the inner `Option` into a temporary whose two arms merged before the move, so LLVM copied the whole `Option<P>`, payload included, for every nested field stored `Inline` (the codegen default), set or not, and then copied it again into the parent. It now builds each arm directly. On an external schema of about 650 messages (a config message with 16 inline nested message fields, measured with a standalone harness, not in this repo), retired instructions per `clone()` drop from 1146 to 679 for an empty message and from 2375 to 1903 with one repeated element, level with prost on the same schema. `Box` fields only skip a pointer-sized copy. Behaviour is unchanged.
