kind: Fixed
body: '**`buffa-remote-derive`: a type or alias named `str`, `u8` or `usize`, or a trait in scope with a by-value `to_str` or `as_slice` method for `WirePayload`, no longer breaks the derives or changes what `from_wire` reads** (#707). The expansions spelled those primitive types without a path, so an item of that name in scope at the derive took their place, and `#[derive(MapStorage)]` beside `type usize = u32;` failed inside the derive with E0053. The `from_wire` of `ProtoString` and `ProtoBytes` called `WirePayload::to_str` and `WirePayload::as_slice` with method-call syntax, which finds a by-value trait method of the same name before the inherent `&self` one, so such a trait in scope made `from_wire` call it instead of reading the payload. The expansions now name `::core::primitive::str`, `::core::primitive::u8` and `::core::primitive::usize`, and call both `WirePayload` methods by path.'
time: 2026-10-15T09:55:49.6361432+02:00
