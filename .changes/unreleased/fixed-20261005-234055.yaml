kind: Fixed
body: |-
    **`DescriptorPool` rejects a `default_value` on a message or group field** (#567). A singular message field, group or message-typed extension with `default_value` set linked, and the value was ignored. It is now `PoolError::MessageFieldWithDefault`, as protoc and protobuf-go reject it.
