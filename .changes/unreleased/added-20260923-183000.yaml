kind: Added
body: |-
    **`buffa-remote-derive`: opt-in `Arbitrary` forwarder** (#290, refs #212). A bare `arbitrary` key alongside `remote` — `#[buffa(remote = ecow::EcoString, arbitrary)]` — makes any of the five derives (`ProtoString`, `ProtoBytes`, `ProtoList`, `ProtoBox`, `MapStorage`) emit `impl arbitrary::Arbitrary` for the newtype, wrapped in `#[cfg(feature = "arbitrary")]` so it appears under the same condition as the `derive(Arbitrary)` codegen puts on a generated message. This removes the hand-written impl a fuzzed build needs for a custom `repeated` collection, map container or box pointer, and for a custom `string`/`bytes` type used as a map key or value.
    The forwarder never asks the remote type for an `Arbitrary` impl of its own (`ecow::EcoString` and `flexstr::SharedStr` have none): it materializes the canonical owned type — `String`, `Vec<u8>`, `Vec<T>`, `Vec<(Key, Value)>` or the pointee `T` — and converts through the `From`/`FromIterator`/`ProtoBox::new` surface the derive already generates, so byte consumption matches the default representation the newtype replaces and a fuzz corpus carries across. Omitting the key leaves expansion exactly as before.
    The serde and `ReflectList`/`ReflectMap` forwarders named in #290 are still unimplemented; the crate docs' matrix remains the reference for writing those by hand.
