kind: Added
body: |-
    **`buffa-remote-derive`: an `arbitrary` key that derives `Arbitrary` for the newtype** (#472, refs #290). A bare `arbitrary` key, as in `#[buffa(remote = ecow::EcoString, arbitrary)]`, makes any of the five derives (`ProtoString`, `ProtoBytes`, `ProtoList`, `ProtoBox`, `MapStorage`) emit `impl arbitrary::Arbitrary` for the newtype. This removes the hand-written impl a fuzzed build needs for a custom `repeated` collection or map container, for a box pointer around a oneof variant, and for a custom `string` type used as a map key or value. The impl is emitted unconditionally, so a crate whose `arbitrary` dependency is optional puts the key behind the same condition: `#[cfg_attr(feature = "arbitrary", buffa(arbitrary))]` next to `#[buffa(remote = ...)]`.
    The remote type does not need an `Arbitrary` impl (`ecow::EcoString` and `flexstr::SharedStr` have none). The impl builds the canonical owned type (`String`, `Vec<u8>`, `Vec<T>`, `Vec<(Key, Value)>` or the pointee `T`) and converts through the `From`/`FromIterator`/`ProtoBox::new` surface the derive already generates. Byte consumption therefore matches the default representation the newtype replaces, `arbitrary_take_rest` included, and a fuzz corpus carries across. Without the key the expansion is unchanged.
    `ReflectList`/`ReflectMap` impls are still written by hand (#290). The `serde` key (#590) supplies serde impls. The crate docs say which newtypes need each, and `examples/custom-types/README.md` tabulates the serde cases.
