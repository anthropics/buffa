kind: Breaking changes
body: |-
    **`ReflectCow` has a new variant, `Empty(EmptyMessage<'a>)`, which `DynamicMessage::get` returns for an unset singular message field instead of allocating** (#443, closes #435). The read used to box a fresh `DynamicMessage` and clone the pool's `Arc`, a write to its shared reference count, on every call. `EmptyMessage` borrows the pool and holds the message's `MessageIndex`; it implements `ReflectMessage` as the empty message (no fields set, no unknown fields, and a nested `get` returns another `EmptyMessage`), with no allocation and no reference-count change. To upgrade, add an `Empty(e)` arm to any exhaustive `match` on `ReflectCow`: `e` implements `ReflectMessage`, and `e.to_dynamic()` yields the owned `DynamicMessage` that the `Owned` arm used to carry for these fields. Code that reads nested messages through `Deref` (`cow.get(fd)`, `&*cow`), `ReflectCow::to_dynamic` or `ValueRef::to_owned` needs no change.
time: 2026-09-14T19:00:00.000000000+00:00
