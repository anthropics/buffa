kind: Breaking changes
body: |-
    **`ReflectCow` is now `#[non_exhaustive]` and has a new variant, `Empty(EmptyMessage<'a>)`, which `DynamicMessage::get` returns for an unset singular message field instead of allocating** (#443, #452, closes #435). The read used to box a fresh `DynamicMessage` and clone the pool's `Arc`, a write to its shared reference count, on every call. `EmptyMessage` borrows the pool and holds the message's `MessageIndex`; it implements `ReflectMessage` as the empty message (no fields set, no unknown fields, and a nested `get` returns another `EmptyMessage`), with no allocation and no reference-count change. Because `ReflectCow` is `#[non_exhaustive]`, it can gain further variants without breaking matches again. To upgrade, add an `Empty(e)` arm and a wildcard arm to any exhaustive `match` on `ReflectCow`, or replace the `match` with `&*cow` when its arms only need a `&dyn ReflectMessage`. Every variant, including future ones, implements `ReflectMessage`, so the wildcard arm should read through `&*cow` or `cow.to_dynamic()` rather than panic: `Empty` is the ordinary result for an unset field. `e.to_dynamic()` on an `Empty(e)` arm yields a `DynamicMessage` by value (with `ReflectMessage` in scope), so an arm that returned the `Box<DynamicMessage>` from `Owned` needs `Box::new`. Code that reads nested messages through `Deref` (`cow.get(fd)`, `&*cow`), `ReflectCow::to_dynamic` or `ValueRef::to_owned` needs no change.
time: 2026-09-14T19:00:00.000000000+00:00
