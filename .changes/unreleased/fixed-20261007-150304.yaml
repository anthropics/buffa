kind: Fixed
body: |-
    **Text format requires the `:` before an empty list on a repeated scalar field** (#614). `tags []` parsed for a repeated field of a scalar, enum, string or bytes type, although the C++ and Go parsers require the colon before any value of such a field, the empty list included; #527 added the check for a list that has elements. It is now an `UnexpectedToken` error at the `[`, so input that omits the colon there no longer parses. `addresses []` on a repeated message field and `stock []` on a map field need no colon, as before.
    The check is in generated code: regenerate any crate built with `generate_text` to get it. Regenerated code needs this release of `buffa`, because it calls the new `TextDecoder::read_repeated_scalar_into`: against an earlier `buffa` it fails to compile with ``no method named `read_repeated_scalar_into` found`` (E0599). Code generated by an earlier release, and a hand-written `TextFormat` impl that calls `read_repeated_into`, keep accepting `tags []`; a hand-written impl gets the check by calling `read_repeated_scalar_into` for its scalar fields.
