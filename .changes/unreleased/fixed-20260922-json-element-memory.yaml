kind: Fixed
body: |-
    **The reflective JSON parser limits element memory, so `DynamicMessage::from_json` and `DynamicMessageSeed` may reject input that parsed in earlier releases** (#466, refs #330). A parse whose repeated elements, map entries, `Struct` members, `ListValue` elements and `FieldMask` paths add up to more than `DEFAULT_ELEMENT_MEMORY_LIMIT` fails with a `serde_json::Error` that reads `element memory limit exceeded at line L column C`. The default is 32 MiB, about half a million repeated elements on a 64-bit target. To accept such input, parse with `DynamicMessageSeed::new(pool, index).with_element_memory_limit(n).parse_json(json)`. Before, nothing bounded the repeated elements and map entries the JSON path built, while `DecodeOptions` bounded them for the same message decoded from protobuf: an empty repeated message element is three JSON bytes and about 64 bytes built, so about 1.5 MB of JSON built 32 MiB. One budget covers the whole parse, nested messages and `google.protobuf.Any` payloads included, with the charges the reflective binary decoder applies.
    The limit does not bound the memory an `Any` payload takes to read. The payload is buffered as a `serde_json::Value` tree before any of it is charged, so cap the input length as well when an `Any` is reachable from the message type. Generated-message JSON is unchanged and still unbounded; #330 stays open for it.
