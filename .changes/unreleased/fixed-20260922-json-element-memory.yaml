kind: Fixed
body: |-
    **`DynamicMessage::from_json` bounds what it materializes** (#330, partial). The reflective JSON parser now carries its own element-memory budget, defaulting to `DEFAULT_ELEMENT_MEMORY_LIMIT` (32 MiB) and raised or lowered with the new `DynamicMessageSeed::with_element_memory_limit(n)`. `DecodeContext` never reaches a serde `Deserializer`, so before this the JSON path was bounded by nothing but `serde_json`'s own recursion limit while the same message decoded from protobuf was bounded by `DecodeOptions`: an empty repeated message element is three JSON bytes (`{},`) and `size_of::<Value>()` in the `Vec` it lands in, so ~400 KB of JSON materialized 32 MiB. Repeated elements (including scalars), map entries, `google.protobuf.Struct` members, `ListValue` elements and `FieldMask` paths are charged their footprint, the budget is shared across the whole parse rather than reset per nested message or `google.protobuf.Any` payload, and the charges match the reflective binary decoder's so the same message costs the same budget on either codec. **This may reject input that parsed in earlier releases**; pass `usize::MAX` for trusted input that legitimately materializes more.
    Generated-message JSON is unchanged and still unbounded — which of the three mechanisms in #330 it should use is a design decision left open there — so the issue stays open.
