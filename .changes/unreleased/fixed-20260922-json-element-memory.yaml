kind: Fixed
body: |-
    **The reflective JSON parser limits element memory, so `DynamicMessage::from_json` and `DynamicMessageSeed` may reject input that parsed in earlier releases** (#466, refs #330). A parse whose repeated elements, map entries, `Struct` members, `ListValue` elements and `FieldMask` paths add up to more than `DEFAULT_ELEMENT_MEMORY_LIMIT` fails with a `serde_json::Error` that reads `element memory limit exceeded at line L column C`. The default is 32 MiB, about half a million repeated elements on a 64-bit target. To accept such input, parse with `DynamicMessage::from_json_with_element_memory_limit(pool, index, json, n)`. Before, nothing bounded the repeated elements and map entries the JSON path built, while `DecodeOptions` bounded them for the same message decoded from protobuf: an empty repeated message element is three JSON bytes and about 64 bytes built, so about 1.5 MB of JSON built 32 MiB. One budget covers the whole parse, nested messages and `google.protobuf.Any` payloads included, with the charges the reflective binary decoder applies.
    The buffer an `Any` payload is read into is charged too; see the #507 entry under Security. Generated-message JSON is unchanged and still unbounded; #330 stays open for it.
