syntax = "proto3";

package reflect.map_identity;

message Holder {
  map<string, int32> items = 1;
  repeated Other.ItemsEntry records = 2;
  repeated HolderExtra.ItemsEntry prefixed_records = 3;
  Nested nested = 4;

  message Nested {
    map<string, int32> items = 1;
    repeated Other.ItemsEntry records = 2;
  }
}

message Other {
  message ItemsEntry {
    int32 id = 1;
    string note = 2;
  }
}

message HolderExtra {
  message ItemsEntry {
    string id = 1;
    int32 count = 2;
  }
}
