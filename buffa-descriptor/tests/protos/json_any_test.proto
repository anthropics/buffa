// An `Any` beside a repeated field, and a repeated `Any`, for the reflective
// JSON element-memory budget: the parser buffers each `Any` payload and
// charges the buffer for as long as it holds it.
syntax = "proto3";

package reflect.json;

import "google/protobuf/any.proto";

message Batch {
  repeated int32 xs = 1;
  google.protobuf.Any payload = 2;
  repeated google.protobuf.Any payloads = 3;
}
