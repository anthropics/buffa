[package]
name = "buffa-codegen"
description = "Shared code generation logic for buffa (descriptor → Rust source)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["protobuf", "protocol-buffers", "codegen"]
categories = ["development-tools::build-utils"]

[dependencies]
buffa = { workspace = true, features = ["std", "fast-utf8"] }
# Codegen reads descriptors via the binary codec only — no views / json /
# text. The workspace dep is `default-features = false`; `std` is added back
# because codegen is a build-time tool, never `no_std`.
buffa-descriptor = { workspace = true, features = ["std"] }
# The `buffa.ext` options that a schema sets on its elements, read from the
# descriptors with the binary codec.
buffa-proto-options = { workspace = true }
prettyplease = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
