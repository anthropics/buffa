[package]
name = "buffa-remote-derive"
description = "Derive macros that implement buffa's pluggable owned-type traits (ProtoString, ProtoBytes, ProtoList, ProtoBox, MapStorage) for a newtype wrapping a foreign remote type"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["protobuf", "protocol-buffers", "derive"]
categories = ["encoding"]

[lib]
proc-macro = true

# Test-only. The emitted forwarders are gated on the *consuming* crate's
# features and this crate's tests are that consumer, so they need a feature by
# that name to compile. The macro reads no features: `#[buffa(arbitrary)]`
# alone selects the forwarder, however this crate was built.
[features]
arbitrary = []

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
arbitrary = { workspace = true }
buffa = { workspace = true, features = ["std"] }
ecow = { workspace = true }
smallvec = { version = "1", default-features = false }
smallbox = { version = "0.8", default-features = false }
indexmap = { version = "2", default-features = false, features = ["std"] }
