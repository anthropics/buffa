syntax = "proto3";

// build.rs compiles this once, as package `tbz`, with `codec_strategy = Table`
// and `bytes` fields stored as `bytes::Bytes`. A table decodes from a
// contiguous slice, where `Bytes` fields could not alias the input, so `Blob`,
// which has such fields, is unrolled, and so are `HoldsBlob`, which holds
// `Blob`, `HoldsBlobs`, which holds `HoldsBlob`, `HoldsBlobInOneof`, which
// holds `Blob` in a oneof member, and `HoldsPick`, which holds that. `Plain`
// and `HoldsPlain` have no `bytes` field and are tables.
package tbz;

message Blob {
  bytes data = 1;
  repeated bytes chunks = 2;
}

message HoldsBlob {
  Blob blob = 1;
  repeated Blob blobs = 2;
  int32 tail = 3;
}

message HoldsBlobs {
  HoldsBlob inner = 1;
}

message HoldsBlobInOneof {
  oneof pick {
    Blob blob = 1;
    int32 n = 2;
  }
}

message HoldsPick {
  HoldsBlobInOneof inner = 1;
}

message Plain {
  int32 x = 1;
}

message HoldsPlain {
  Plain plain = 1;
}
