syntax = "proto2";

package test.extname_table;

import "buffa/ext/options.proto";

message Flat {
  optional string type = 1 [(buffa.ext.field).name = "kind"];
  repeated int32 match = 2 [(buffa.ext.field).name = "hits"];
  optional Leaf leaf = 3 [(buffa.ext.field).name = "child"];
