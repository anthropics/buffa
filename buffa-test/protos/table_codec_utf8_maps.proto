edition = "2023";

// Compiled as `tcu8u`/`tcu8t` (see table_codec.proto), with
// `strict_utf8_mapping` and `use_bytes_type`, under which a string without
// UTF-8 validation is `Vec<u8>` and a `bytes` field is `Bytes`.
package tcu8;

import "google/protobuf/wrappers.proto";

// Table messages: without UTF-8 validation a string is `Vec<u8>`. The key of
// `carve` is such a string, so the map keeps `Vec<u8>` values, though
// `use_bytes_type` would make them `Bytes`.
message Utf8Maps {
  map<string, string> checked = 1;
  map<string, string> raw = 2 [features.utf8_validation = NONE];
  map<string, bytes> carve = 3 [features.utf8_validation = NONE];
}

// The values are `Bytes`, so a table cannot hold them and these stay unrolled.
message BytesValues {
  map<string, bytes> blobs = 1;
}

message RawValues {
  map<int32, string> raw_values = 1 [features.utf8_validation = NONE];
}

// The value is generated by another crate, which has no table here, so the
// table reaches it through its `Message` impl.
message WrapperValues {
  map<string, google.protobuf.Int32Value> counts = 1;
}
