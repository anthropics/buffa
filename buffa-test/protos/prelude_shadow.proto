// Regression for gh#36: a proto message named `Option` in a nested scope
// shadows `core::option::Option` via the `use super::*` chain, breaking
// generated optional/oneof field types and the JSON deserialize path.
//
// Covers top-level, 1-level nested, and 3-level nested `Option` messages,
// each with an optional scalar and a oneof so the struct-field type, the
// `skip_serializing_if` predicate, and the custom-deserialize temporaries
// all emit `::core::option::Option<...>`.
//
// Built with views, JSON and setters enabled — compilation alone is the
// assertion.

syntax = "proto3";

package test.prelude_shadow;

// Top-level — exercises the JSON path (skip_serializing_if, deser temps).
message Option {
  optional string title = 1;
  oneof value {
    uint64 int_value = 2;
    string str_value = 3;
  }
}

// 1-level nested — the original gh#36 reproduction. `Option` is declared
// inside `mod picker { use super::*; ... }`, shadowing the prelude there.
message Picker {
  message Option {
    optional string title = 1;
    oneof value {
      uint64 int_value = 2;
      string str_value = 3;
    }
  }
  repeated Option options = 1;
  optional string label = 2;
}

// Sibling propagation — `Option` and `Middle` are both nested in `Outer`,
// so `mod outer` declares `struct Option` (shadowing the prelude there and
// in `mod outer::middle` via `use super::*`). `Inner.x` must use the
// fully-qualified path.
message Outer {
  message Option {
    bool present = 1;
  }
  message Middle {
    message Inner {
      optional int32 x = 1;
    }
    optional Inner inner = 1;
    optional string note = 2;
  }
  optional Middle middle = 1;
}

// Regression for the kind-tree collision: a `message View` produces a
// nested-type module `pub mod view { ... }`. Under the sentinel design
// the kind-tree view wrapper is `pub mod __buffa { pub mod view { ... } }`,
// so this no longer collides. Compilation is the assertion.
message View {
  message Inner {
    optional string s = 1;
  }
  optional Inner inner = 1;
}

// A message named `Serde` produces a nested-type module `pub mod serde`,
// which shadows the `serde` crate for every sibling item in this package and
// for everything inside the module. The JSON emitters (derive lists, the
// custom oneof Serialize/Deserialize impls, the DeserializeSeed helper for
// the non-oneof field) must therefore spell `::serde::` absolutely.
// Compilation is the assertion.
message Serde {
  message Inner {
    optional string s = 1;
    oneof pick {
      uint64 int_value = 2;
      string str_value = 3;
    }
  }
  optional string name = 1;
  optional Inner inner = 2;
  oneof kind {
    uint64 int_value = 3;
    string str_value = 4;
  }
}

// Messages named `From` and `Into`, and a oneof named `from`, shadow the
// conversion traits. The oneof `From` impls and the `with_*` setters name
// those traits, so both must spell `::core::convert::`. `Transfer.from`
// generates an enum `From` in the oneof module, and its variants hold the
// `From` and `Into` messages; `note` generates `with_note(impl Into<String>)`
// beside the `Into` struct. Compilation is the assertion.
message From {
  optional string address = 1;
}

message Into {
  optional string address = 1;
}

message Transfer {
  oneof from {
    From sender = 1;
    Into relay = 2;
    string raw = 3;
  }
  optional string note = 4;
  optional bytes memo = 5;
}

// Types named `S`, `D`, `E` and `A`. A generic parameter named `E` shadows a
// schema type `E` in that function's signature, body and nested items, so
// the generated serde impls name their parameters `__S`, `__D`, `__E` and
// `__A`. `Letters` has a oneof, which selects the custom `Deserialize` impl.
// Compilation is the assertion.
message S {
  optional string v = 1;
}

message D {
  optional string v = 1;
}

message A {
  optional string v = 1;
}

enum E {
  E_UNSPECIFIED = 0;
  E_ONE = 1;
}

message Letters {
  S s = 1;
  D d = 2;
  repeated D ds = 3;
  map<string, A> as = 4;
  E e = 5;
  repeated E es = 6;
  optional E maybe_e = 7;
  oneof pick {
    S pick_s = 8;
    D pick_d = 9;
    A pick_a = 10;
    E pick_e = 11;
  }
}
